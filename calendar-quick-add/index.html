<!DOCTYPE html>
<html lang="ja">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>かんたん予定追加</title>
<style>
  :root {
    --bg: #f4f6f8; --card: #fff; --text: #1f2933; --muted: #6b7785; --line: #dde3ea;
    --primary: #1a73e8; --primary-weak: #e8f0fe; --warn: #b3261e; --warn-weak: #fdecea;
    --sat: #1565c0; --ok: #137333; --ok-weak: #e6f4ea;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif;
         background: var(--bg); color: var(--text); font-size: 16px; }
  header { position: sticky; top: 0; z-index: 10; background: var(--card); border-bottom: 1px solid var(--line); }
  h1 { font-size: 17px; margin: 0; padding: 12px 16px 4px; }
  nav { display: flex; overflow-x: auto; gap: 4px; padding: 4px 8px 0; }
  nav button { flex: 1 0 auto; border: 0; background: none; padding: 10px 14px; font-size: 15px; color: var(--muted);
               border-bottom: 3px solid transparent; cursor: pointer; }
  nav button.active { color: var(--primary); border-bottom-color: var(--primary); font-weight: 600; }
  main { max-width: 640px; margin: 0 auto; padding: 12px 12px 120px; }
  .card { background: var(--card); border-radius: 12px; padding: 14px; margin-bottom: 12px; box-shadow: 0 1px 2px rgba(0,0,0,.06); }
  label.field { display: block; font-size: 13px; color: var(--muted); margin: 10px 0 4px; }
  label.field:first-child { margin-top: 0; }
  input[type=text], input[type=date], input[type=time], input[type=number], select, textarea {
    width: 100%; padding: 10px 12px; font-size: 16px; border: 1px solid var(--line); border-radius: 8px; background: #fff; color: var(--text);
  }
  textarea { min-height: 60px; resize: vertical; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
  .chip { border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 9px 14px; font-size: 15px; cursor: pointer; }
  .chip.on { background: var(--primary-weak); border-color: var(--primary); color: var(--primary); font-weight: 600; }
  .row { display: flex; gap: 8px; align-items: center; }
  .row > * { flex: 1; }
  .custom-line { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
  .custom-line input { flex: 1; }
  .custom-line .chip { flex: 0 0 auto; }
  .preview { list-style: none; padding: 0; margin: 0; }
  .preview li { display: flex; justify-content: space-between; gap: 8px; padding: 9px 0; border-bottom: 1px dashed var(--line); }
  .preview li:last-child { border-bottom: 0; }
  .preview .t { font-weight: 600; }
  .preview .d { white-space: nowrap; }
  .sun, .hol { color: var(--warn); }
  .sat { color: var(--sat); }
  .badge { display: inline-block; font-size: 12px; padding: 1px 6px; border-radius: 4px; margin-left: 4px; vertical-align: 1px; }
  .badge.warn { background: var(--warn-weak); color: var(--warn); }
  .empty { color: var(--muted); font-size: 14px; }
  .cal-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; }
  .check { display: flex; align-items: center; gap: 8px; margin-top: 10px; font-size: 15px; }
  .check input { width: 20px; height: 20px; }
  .submit-bar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--card); border-top: 1px solid var(--line); padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); }
  .submit-bar .inner { max-width: 640px; margin: 0 auto; }
  .btn { width: 100%; border: 0; border-radius: 10px; padding: 14px; font-size: 17px; font-weight: 600; cursor: pointer; background: var(--primary); color: #fff; }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn.secondary { background: var(--primary-weak); color: var(--primary); }
  .toast { position: fixed; left: 12px; right: 12px; bottom: 84px; max-width: 616px; margin: 0 auto; padding: 12px 14px; border-radius: 10px;
           background: #323232; color: #fff; font-size: 14px; display: none; z-index: 20; }
  .toast.show { display: flex; gap: 12px; align-items: center; justify-content: space-between; }
  .toast.error { background: var(--warn); }
  .toast button { background: none; border: 0; color: #8ab4f8; font-weight: 700; font-size: 14px; cursor: pointer; white-space: nowrap; }
  .hidden { display: none !important; }
  .muted { color: var(--muted); font-size: 13px; }
  .settings-row { padding: 8px 0; border-bottom: 1px solid var(--line); }
  .settings-row:last-child { border-bottom: 0; }
  .loading { text-align: center; color: var(--muted); padding: 40px 0; }
</style>
</head>
<body>
<header>
  <h1>📅 かんたん予定追加</h1>
  <nav id="tabs"></nav>
</header>

<main id="main">
  <div class="loading" id="loading">読み込み中…</div>
</main>

<div class="submit-bar hidden" id="submitBar">
  <div class="inner"><button class="btn" id="submitBtn">カレンダーに追加</button></div>
</div>

<div class="toast" id="toast"><span id="toastMsg"></span><button id="toastAction" class="hidden">取り消す</button></div>

<!-- ===== 破壊試験フォーム ===== -->
<template id="tpl-concrete">
  <div class="card">
    <label class="field">現場名</label>
    <input type="text" data-k="site" list="siteList" placeholder="例）○○ビル新築工事" autocomplete="off">
    <datalist id="siteList"></datalist>

    <label class="field">部位・メモ（任意）</label>
    <input type="text" data-k="part" placeholder="例）2F床・梁 / 21-18-20N">

    <label class="field">打設日</label>
    <input type="date" data-k="castDate">
    <div class="chips" data-quick="castDate"></div>
  </div>

  <div class="card">
    <label class="field">破壊日（タップで選択／複数可）</label>
    <div class="chips" data-k="ages"></div>

    <div class="custom-line">
      <span class="muted" style="flex:0 0 auto">材齢</span>
      <input type="number" data-k="customAge" min="1" max="365" inputmode="numeric" placeholder="任意の日数">
      <span class="muted" style="flex:0 0 auto">日</span>
      <button class="chip" data-add="age">＋追加</button>
    </div>
    <div class="custom-line">
      <input type="date" data-k="customDate">
      <button class="chip" data-add="date">＋日付で追加</button>
    </div>

    <label class="check"><input type="checkbox" data-k="includeCast"> 打設日も予定に入れる</label>
  </div>

  <div class="card">
    <label class="field">登録内容プレビュー</label>
    <ul class="preview" data-k="preview"></ul>
  </div>

  <div class="card">
    <label class="field">登録先カレンダー</label>
    <select data-k="calendar"></select>
    <label class="field">通知</label>
    <select data-k="reminder">
      <option value="">通知しない</option>
      <option value="420" selected>前日 17:00</option>
      <option value="900">前日 9:00</option>
      <option value="1860">2日前 17:00</option>
    </select>
  </div>
</template>

<!-- ===== 一般予定フォーム（営業・修理など） ===== -->
<template id="tpl-appointment">
  <div class="card">
    <label class="field">件名（顧客名・現場名など）</label>
    <input type="text" data-k="title" placeholder="例）△△様 打合せ" autocomplete="off">

    <label class="field">日付</label>
    <input type="date" data-k="date">
    <div class="chips" data-quick="date"></div>

    <label class="field">開始時刻</label>
    <input type="time" data-k="time" step="300">
    <div class="chips" data-k="timeChips"></div>

    <label class="field">所要時間</label>
    <div class="chips" data-k="durationChips"></div>
  </div>

  <div class="card">
    <label class="field">場所（任意）</label>
    <input type="text" data-k="location" placeholder="住所や地図に出る名称">
    <label class="field">メモ（任意）</label>
    <textarea data-k="memo" placeholder="連絡先・依頼内容など"></textarea>
  </div>

  <div class="card">
    <label class="field">登録内容プレビュー</label>
    <ul class="preview" data-k="preview"></ul>
  </div>

  <div class="card">
    <label class="field">登録先カレンダー</label>
    <select data-k="calendar"></select>
    <label class="field">通知</label>
    <select data-k="reminder">
      <option value="">通知しない</option>
      <option value="10">10分前</option>
      <option value="30" selected>30分前</option>
      <option value="60">1時間前</option>
      <option value="1440">前日（同時刻）</option>
    </select>
  </div>
</template>

<script>
/* ---------------------------------------------------------------------------
 * サーバー呼び出し（google.script.run）を Promise 化。
 * ローカルでHTMLを直接開いた場合はデモ用のモックで動作します。
 * ------------------------------------------------------------------------- */
const server = (function () {
  if (window.google && google.script && google.script.run) {
    return new Proxy({}, {
      get: (_, fn) => (...args) => new Promise((resolve, reject) =>
        google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[fn](...args))
    });
  }
  // ---- デモ用モック ----
  console.warn('google.script.run がないためデモモードで動作します');
  const demoSettings = {};
  let seq = 0;
  return {
    getInitData: async () => ({
      categories: [
        { key: 'concrete', label: '破壊試験', type: 'concrete', prefix: '' },
        { key: 'sales', label: '営業', type: 'appointment', prefix: '【営業】' },
        { key: 'repair', label: '修理', type: 'appointment', prefix: '【修理】' },
      ],
      concreteAges: [7, 28],
      calendars: [
        { id: 'me', name: '自分（デモ）', color: '#1a73e8' },
        { id: 'genba', name: '現場・試験（デモ）', color: '#e67c73' },
        { id: 'eigyo', name: '営業（デモ）', color: '#33b679' },
        { id: 'shuri', name: '修理（デモ）', color: '#f6bf26' },
      ],
      settings: Object.assign({ concrete: 'genba', sales: 'eigyo', repair: 'shuri' }, demoSettings),
      recentSites: ['○○ビル新築工事', '△△邸 基礎'],
    }),
    saveSettings: async (s) => Object.assign(demoSettings, s),
    getHolidays: async (dates) => {
      const fixed = { '01-01': '元日', '02-11': '建国記念の日', '02-23': '天皇誕生日', '04-29': '昭和の日',
        '05-03': '憲法記念日', '05-04': 'みどりの日', '05-05': 'こどもの日', '08-11': '山の日',
        '11-03': '文化の日', '11-23': '勤労感謝の日' };
      const r = {}; dates.forEach(d => { if (fixed[d.slice(5)]) r[d] = fixed[d.slice(5)]; }); return r;
    },
    addEvents: async (p) => { console.log('addEvents', p);
      return { calendarName: p.calendarId, created: p.events.map(e => ({ id: 'demo' + (++seq), title: e.title, date: e.date })) }; },
    deleteEvents: async (cal, ids) => ids.length,
  };
})();

/* ---------- 日付ユーティリティ（タイムゾーンの影響を受けないよう UTC で計算） ---------- */
const WD = ['日', '月', '火', '水', '木', '金', '土'];
const toUTC = (iso) => { const [y, m, d] = iso.split('-').map(Number); return new Date(Date.UTC(y, m - 1, d)); };
const fromUTC = (dt) => dt.toISOString().slice(0, 10);
const addDays = (iso, n) => { const d = toUTC(iso); d.setUTCDate(d.getUTCDate() + n); return fromUTC(d); };
const diffDays = (a, b) => Math.round((toUTC(b) - toUTC(a)) / 86400000);
const today = () => { const n = new Date(); return fromUTC(new Date(Date.UTC(n.getFullYear(), n.getMonth(), n.getDate()))); };
const weekday = (iso) => toUTC(iso).getUTCDay();
const fmtDate = (iso) => { const d = toUTC(iso); return `${d.getUTCFullYear()}/${d.getUTCMonth() + 1}/${d.getUTCDate()}(${WD[d.getUTCDay()]})`; };
const fmtDur = (min) => min >= 60 ? `${Math.floor(min / 60)}時間${min % 60 ? (min % 60) + '分' : ''}` : `${min}分`;
const addMinutes = (hhmm, min) => { const [h, m] = hhmm.split(':').map(Number); const t = h * 60 + m + min;
  return `${String(Math.floor(t / 60) % 24).padStart(2, '0')}:${String(t % 60).padStart(2, '0')}`; };
const esc = (s) => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/* ---------- 状態 ---------- */
let INIT = null;
const holidayCache = {};
const views = {};     // key -> { el, state, buildEvents(), render() }
let currentKey = null;

/* ---------- 共通部品 ---------- */
function $(root, k) { return root.querySelector(`[data-k="${k}"]`); }

function fillCalendarSelect(sel, selectedId) {
  sel.innerHTML = INIT.calendars.map(c =>
    `<option value="${esc(c.id)}" ${c.id === selectedId ? 'selected' : ''}>${esc(c.name)}</option>`).join('');
}

function quickDateChips(container, input, onChange) {
  const opts = [['今日', 0], ['明日', 1], ['明後日', 2]];
  container.innerHTML = '';
  opts.forEach(([label, n]) => {
    const b = document.createElement('button');
    b.className = 'chip'; b.textContent = label;
    b.onclick = () => { input.value = addDays(today(), n); onChange(); };
    container.appendChild(b);
  });
  const sync = () => [...container.children].forEach((b, i) => b.classList.toggle('on', input.value === addDays(today(), opts[i][1])));
  input.addEventListener('change', () => { onChange(); });
  return sync;
}

function dayClass(iso) {
  if (holidayCache[iso]) return 'hol';
  const w = weekday(iso);
  return w === 0 ? 'sun' : w === 6 ? 'sat' : '';
}

function dayWarn(iso) {
  if (holidayCache[iso]) return `<span class="badge warn">${esc(holidayCache[iso])}</span>`;
  const w = weekday(iso);
  if (w === 0) return '<span class="badge warn">日曜</span>';
  if (w === 6) return '<span class="badge warn">土曜</span>';
  return '';
}

async function ensureHolidays(dates, rerender) {
  const missing = dates.filter(d => !(d in holidayCache));
  if (!missing.length) return;
  missing.forEach(d => { holidayCache[d] = holidayCache[d] || ''; });
  try {
    const res = await server.getHolidays(missing);
    Object.assign(holidayCache, res);
    if (Object.keys(res).length) rerender();
  } catch (e) { /* 祝日判定はおまけなので失敗しても続行 */ }
}

/* ---------- 破壊試験ビュー ---------- */
function createConcreteView(cat) {
  const wrap = document.createElement('div');
  wrap.appendChild(document.getElementById('tpl-concrete').content.cloneNode(true));
  const state = { ages: new Set([...INIT.concreteAges]), customAges: new Set(), customDates: new Set() };

  const site = $(wrap, 'site'), part = $(wrap, 'part'), cast = $(wrap, 'castDate');
  const agesBox = $(wrap, 'ages'), customAge = $(wrap, 'customAge'), customDate = $(wrap, 'customDate');
  const includeCast = $(wrap, 'includeCast'), preview = $(wrap, 'preview');
  const calSel = $(wrap, 'calendar'), reminder = $(wrap, 'reminder');

  wrap.querySelector('#siteList').innerHTML = INIT.recentSites.map(s => `<option value="${esc(s)}">`).join('');
  cast.value = today();
  fillCalendarSelect(calSel, INIT.settings[cat.key]);
  const syncQuick = quickDateChips(wrap.querySelector('[data-quick="castDate"]'), cast, () => render());

  wrap.querySelector('[data-add="age"]').onclick = () => {
    const n = parseInt(customAge.value, 10);
    if (!(n > 0)) return toast('日数を入力してください', true);
    if (INIT.concreteAges.includes(n)) state.ages.add(n); else state.customAges.add(n);
    customAge.value = ''; render();
  };
  wrap.querySelector('[data-add="date"]').onclick = () => {
    if (!customDate.value) return toast('日付を選んでください', true);
    state.customDates.add(customDate.value); customDate.value = ''; render();
  };
  [site, part].forEach(i => i.addEventListener('input', () => render()));
  includeCast.addEventListener('change', () => render());

  function items() {
    const list = [];
    if (!cast.value) return list;
    if (includeCast.checked) list.push({ kind: 'cast', date: cast.value, label: '打設' });
    const ages = [...state.ages, ...state.customAges].sort((a, b) => a - b);
    ages.forEach(n => list.push({ kind: 'age', age: n, date: addDays(cast.value, n), label: `${n}日破壊` }));
    [...state.customDates].sort().forEach(d => {
      const n = diffDays(cast.value, d);
      list.push({ kind: 'date', date: d, age: n, label: n > 0 ? `${n}日破壊` : '破壊試験' });
    });
    return list.sort((a, b) => a.date.localeCompare(b.date));
  }

  function titleOf(it) {
    const name = [site.value.trim(), part.value.trim()].filter(Boolean).join(' ');
    return `${cat.prefix || ''}【${it.label}】${name}`;
  }

  function render() {
    syncQuick();
    // 材齢チップ
    agesBox.innerHTML = '';
    const allAges = [...new Set([...INIT.concreteAges, ...state.customAges])].sort((a, b) => a - b);
    allAges.forEach(n => {
      const on = state.ages.has(n) || state.customAges.has(n);
      const b = document.createElement('button');
      b.className = 'chip' + (on ? ' on' : '');
      b.innerHTML = `材齢${n}日` + (cast.value ? ` <small>${fmtDate(addDays(cast.value, n)).slice(5)}</small>` : '');
      b.onclick = () => {
        if (INIT.concreteAges.includes(n)) { state.ages.has(n) ? state.ages.delete(n) : state.ages.add(n); }
        else state.customAges.delete(n);
        render();
      };
      agesBox.appendChild(b);
    });
    [...state.customDates].sort().forEach(d => {
      const b = document.createElement('button');
      b.className = 'chip on'; b.innerHTML = `${fmtDate(d).slice(5)} ✕`;
      b.onclick = () => { state.customDates.delete(d); render(); };
      agesBox.appendChild(b);
    });

    // プレビュー
    const list = items();
    if (!site.value.trim()) preview.innerHTML = '<li class="empty">現場名を入力してください</li>';
    else if (!list.length) preview.innerHTML = '<li class="empty">破壊日を選んでください</li>';
    else preview.innerHTML = list.map(it =>
      `<li><span class="t">${esc(titleOf(it))}</span><span class="d ${dayClass(it.date)}">${fmtDate(it.date)}${dayWarn(it.date)}</span></li>`).join('');
    ensureHolidays(list.map(i => i.date), render);
    updateSubmit();
  }

  function buildPayload() {
    if (!site.value.trim()) throw new Error('現場名を入力してください');
    const list = items();
    if (!list.length) throw new Error('破壊日を選んでください');
    const rem = reminder.value === '' ? undefined : Number(reminder.value);
    return {
      calendarId: calSel.value,
      siteName: site.value.trim(),
      events: list.map(it => ({
        title: titleOf(it), date: it.date, allDay: true,
        description: [
          `現場: ${site.value.trim()}`,
          part.value.trim() && `部位: ${part.value.trim()}`,
          `打設日: ${fmtDate(cast.value)}`,
          it.kind !== 'cast' && it.age > 0 && `材齢: ${it.age}日`,
          '（かんたん予定追加で登録）',
        ].filter(Boolean).join('\n'),
        // 終日予定の通知は「当日 0:00 の◯分前」で指定（420分前 = 前日17:00）
        reminderMin: rem,
      })),
    };
  }

  function reset() { state.customDates.clear(); state.customAges.clear(); part.value = ''; render(); }
  function isReady() { return !!site.value.trim() && items().length > 0; }

  return { el: wrap, render, buildPayload, reset, isReady,
           setCalendar: (id) => { calSel.value = id; },
           addRecentSite: (s) => { if (!INIT.recentSites.includes(s)) { INIT.recentSites.unshift(s);
             wrap.querySelector('#siteList').innerHTML = INIT.recentSites.map(x => `<option value="${esc(x)}">`).join(''); } } };
}

/* ---------- 一般予定ビュー ---------- */
function createAppointmentView(cat) {
  const wrap = document.createElement('div');
  wrap.appendChild(document.getElementById('tpl-appointment').content.cloneNode(true));
  const title = $(wrap, 'title'), date = $(wrap, 'date'), time = $(wrap, 'time');
  const timeChips = $(wrap, 'timeChips'), durChips = $(wrap, 'durationChips');
  const location = $(wrap, 'location'), memo = $(wrap, 'memo'), preview = $(wrap, 'preview');
  const calSel = $(wrap, 'calendar'), reminder = $(wrap, 'reminder');
  const state = { duration: 60 };  // 0 = 終日

  date.value = today();
  time.value = '10:00';
  fillCalendarSelect(calSel, INIT.settings[cat.key]);
  const syncQuick = quickDateChips(wrap.querySelector('[data-quick="date"]'), date, () => render());

  const TIMES = ['09:00', '10:00', '11:00', '13:00', '14:00', '15:00', '16:00'];
  const DURS = [[30, '30分'], [60, '1時間'], [90, '1.5時間'], [120, '2時間'], [180, '3時間'], [0, '終日']];

  [title, location, memo].forEach(i => i.addEventListener('input', () => render()));
  time.addEventListener('change', () => render());

  function fullTitle() { return `${cat.prefix || ''}${title.value.trim()}`; }

  function render() {
    syncQuick();
    timeChips.innerHTML = '';
    TIMES.forEach(t => {
      const b = document.createElement('button');
      b.className = 'chip' + (time.value === t ? ' on' : '');
      b.textContent = t.replace(/^0/, '');
      b.disabled = state.duration === 0;
      b.style.opacity = state.duration === 0 ? .4 : 1;
      b.onclick = () => { time.value = t; render(); };
      timeChips.appendChild(b);
    });
    time.disabled = state.duration === 0;
    durChips.innerHTML = '';
    DURS.forEach(([m, label]) => {
      const b = document.createElement('button');
      b.className = 'chip' + (state.duration === m ? ' on' : '');
      b.textContent = label;
      b.onclick = () => { state.duration = m; render(); };
      durChips.appendChild(b);
    });

    if (!title.value.trim()) preview.innerHTML = '<li class="empty">件名を入力してください</li>';
    else if (!date.value) preview.innerHTML = '<li class="empty">日付を選んでください</li>';
    else {
      const when = state.duration === 0 ? '終日'
        : `${time.value}〜${addMinutes(time.value, state.duration)}（${fmtDur(state.duration)}）`;
      preview.innerHTML = `<li><span class="t">${esc(fullTitle())}</span><span class="d ${dayClass(date.value)}">${fmtDate(date.value)}${dayWarn(date.value)}</span></li>
        <li><span class="muted">時間</span><span>${when}</span></li>` +
        (location.value.trim() ? `<li><span class="muted">場所</span><span>${esc(location.value.trim())}</span></li>` : '');
      ensureHolidays([date.value], render);
    }
    updateSubmit();
  }

  function buildPayload() {
    if (!title.value.trim()) throw new Error('件名を入力してください');
    if (!date.value) throw new Error('日付を選んでください');
    if (state.duration !== 0 && !time.value) throw new Error('開始時刻を入力してください');
    return {
      calendarId: calSel.value,
      events: [{
        title: fullTitle(), date: date.value, allDay: state.duration === 0,
        startTime: time.value, durationMin: state.duration,
        location: location.value.trim(), description: memo.value.trim(),
        reminderMin: reminder.value === '' ? undefined : Number(reminder.value),
      }],
    };
  }

  function reset() { title.value = ''; location.value = ''; memo.value = ''; render(); }
  function isReady() { return !!title.value.trim() && !!date.value; }

  return { el: wrap, render, buildPayload, reset, isReady, setCalendar: (id) => { calSel.value = id; } };
}

/* ---------- 設定ビュー ---------- */
function createSettingsView() {
  const wrap = document.createElement('div');
  wrap.innerHTML = `
    <div class="card">
      <div style="font-weight:600;margin-bottom:6px">カテゴリごとの登録先カレンダー</div>
      <div class="muted" style="margin-bottom:8px">各タブで最初に選ばれるカレンダーです。登録時に個別に変更もできます。</div>
      <div id="settingsRows"></div>
    </div>
    <div class="card muted">
      カテゴリ（タブ）の追加・名前変更、材齢ボタン（7日・28日）の変更は、Apps Script の <b>Code.gs</b> 冒頭の
      <code>CATEGORIES</code> / <code>CONCRETE_AGES</code> を編集してください。
    </div>`;
  const rows = wrap.querySelector('#settingsRows');
  INIT.categories.forEach(cat => {
    const r = document.createElement('div');
    r.className = 'settings-row';
    r.innerHTML = `<label class="field">${esc(cat.label)}</label><select data-cat="${esc(cat.key)}"></select>`;
    fillCalendarSelect(r.querySelector('select'), INIT.settings[cat.key]);
    rows.appendChild(r);
  });

  async function save() {
    const s = {};
    rows.querySelectorAll('select').forEach(sel => { s[sel.dataset.cat] = sel.value; });
    await server.saveSettings(s);
    Object.assign(INIT.settings, s);
    INIT.categories.forEach(cat => views[cat.key] && views[cat.key].setCalendar(s[cat.key]));
    toast('設定を保存しました');
  }
  return { el: wrap, render: () => {}, isReady: () => true, save };
}

/* ---------- 画面切替・送信 ---------- */
const submitBtn = document.getElementById('submitBtn');
const submitBar = document.getElementById('submitBar');
let busy = false;

function updateSubmit() {
  const v = views[currentKey];
  if (!v) return;
  if (currentKey === '__settings') { submitBtn.textContent = '設定を保存'; submitBtn.disabled = busy; return; }
  const cat = INIT.categories.find(c => c.key === currentKey);
  let n = 0;
  try { n = v.isReady() ? v.buildPayload().events.length : 0; } catch (e) { n = 0; }
  submitBtn.textContent = n > 1 ? `${cat.label}を ${n} 件まとめて追加` : `${cat.label}をカレンダーに追加`;
  submitBtn.disabled = busy || n === 0;
}

function showTab(key) {
  currentKey = key;
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('active', b.dataset.key === key));
  const main = document.getElementById('main');
  main.innerHTML = '';
  main.appendChild(views[key].el);
  views[key].render();
  updateSubmit();
  try { localStorage.setItem('quickAddTab', key); } catch (e) {}
}

submitBtn.onclick = async () => {
  const v = views[currentKey];
  if (busy) return;
  busy = true; updateSubmit();
  try {
    if (currentKey === '__settings') { await v.save(); return; }
    const payload = v.buildPayload();
    const res = await server.addEvents(payload);
    const ids = res.created.map(c => c.id);
    toast(`「${res.calendarName}」に ${res.created.length} 件追加しました`, false, async () => {
      const n = await server.deleteEvents(payload.calendarId, ids);
      toast(`${n} 件を取り消しました`);
    });
    if (payload.siteName && v.addRecentSite) v.addRecentSite(payload.siteName);
    v.reset();
  } catch (e) {
    toast((e && e.message) || String(e), true);
  } finally {
    busy = false; updateSubmit();
  }
};

let toastTimer = null;
function toast(msg, isError, undo) {
  const t = document.getElementById('toast'), a = document.getElementById('toastAction');
  document.getElementById('toastMsg').textContent = msg;
  t.className = 'toast show' + (isError ? ' error' : '');
  a.classList.toggle('hidden', !undo);
  a.onclick = undo ? async () => { a.classList.add('hidden'); try { await undo(); } catch (e) { toast(e.message || String(e), true); } } : null;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.className = 'toast'; }, undo ? 8000 : 3500);
}

/* ---------- 起動 ---------- */
(async function init() {
  try {
    INIT = await server.getInitData();
  } catch (e) {
    document.getElementById('loading').textContent = '読み込みに失敗しました: ' + (e.message || e);
    return;
  }
  const tabs = document.getElementById('tabs');
  INIT.categories.forEach(cat => {
    views[cat.key] = cat.type === 'concrete' ? createConcreteView(cat) : createAppointmentView(cat);
    const b = document.createElement('button');
    b.textContent = cat.label; b.dataset.key = cat.key; b.onclick = () => showTab(cat.key);
    tabs.appendChild(b);
  });
  views.__settings = createSettingsView();
  const sb = document.createElement('button');
  sb.textContent = '⚙ 設定'; sb.dataset.key = '__settings'; sb.onclick = () => showTab('__settings');
  tabs.appendChild(sb);

  submitBar.classList.remove('hidden');
  let start = INIT.categories[0].key;
  try { const s = localStorage.getItem('quickAddTab'); if (views[s]) start = s; } catch (e) {}
  showTab(start);
})();
</script>
