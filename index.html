<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#eef1f5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="打設管理">
<title>生コン打設管理</title>
<style>
  :root{
    --line:#b9c0c9;
    --line-strong:#7c8794;
    --head:#e8eef5;
    --head2:#dbe5f0;
    --calc-bg:#f4f7fa;
    --sel:#1c6ed0;
    --time-bg:#f5fbf6;
    --warn:#fff4d6;
    --alert:#ffe0e0;
    --text:#16202b;
    --muted:#68727e;
    color-scheme:light;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:rgba(28,110,208,.12);}
  html,body{margin:0;padding:0;background:#eef1f5;}
  body{
    font-family:"Meiryo","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
    color:var(--text);font-size:13px;-webkit-text-size-adjust:100%;
  }
  .sheet{
    max-width:1500px;margin:0 auto;background:#fff;min-height:100vh;
    border-left:1px solid var(--line-strong);border-right:1px solid var(--line-strong);
  }
  button{font-family:inherit;}

  /* ===== ヘッダー ===== */
  header.title-block{padding:12px 10px 10px;text-align:center;border-bottom:2px solid var(--line-strong);}
  header.title-block h1{font-size:17px;margin:0 0 9px;letter-spacing:.3em;font-weight:700;}
  .site-fields{display:flex;flex-wrap:wrap;justify-content:center;align-items:baseline;gap:6px 20px;}
  .fld{display:inline-flex;align-items:baseline;gap:6px;}
  .fld > label{font-size:12px;color:#4a5563;white-space:nowrap;}
  .fld > input{
    font:inherit;font-size:16px;text-align:center;border:none;border-bottom:1px solid var(--line);
    background:transparent;padding:3px 4px;color:var(--text);border-radius:0;
  }
  .fld > input:focus{outline:none;border-bottom:2px solid var(--sel);background:#f2f7ff;}
  .fld.big > input{font-size:17px;font-weight:700;width:min(70vw,300px);}
  .fld.mid > input{width:min(60vw,200px);}
  .fld.sm  > input{width:130px;}
  .fld.sm2 > input{width:90px;}

  /* ===== ツールバー ===== */
  .toolbar{
    display:flex;flex-wrap:wrap;gap:6px;align-items:center;
    padding:7px 8px;background:#f6f8fa;border-bottom:1px solid var(--line);
  }
  .toolbar button{
    font-size:13px;padding:8px 12px;border:1px solid var(--line-strong);border-radius:6px;
    background:linear-gradient(#fff,#eef1f5);cursor:pointer;min-height:38px;
  }
  .toolbar button:active{background:#cfdcea;}
  .toolbar .spacer{flex:1;}
  .toolbar .hint{color:var(--muted);font-size:11.5px;}
  .toolbar button.danger{color:#8c1c1c;border-color:#c99;}
  .toolbar button.primary{background:linear-gradient(#eaf6ec,#d6ebda);border-color:#8bb795;font-weight:700;}

  /* ===== カード表示 ===== */
  .view-cards{display:none;flex-direction:column;gap:8px;padding:8px;}
  .card{border:1px solid var(--line);border-radius:9px;background:#fff;padding:8px;}
  .card.is-sel{border-color:var(--sel);box-shadow:0 0 0 2px rgba(28,110,208,.16);}
  .card-top{display:flex;align-items:center;gap:6px;margin-bottom:7px;}
  .tapfld{
    font:inherit;border:1px solid transparent;background:#f4f6f9;border-radius:6px;
    padding:6px 8px;min-height:36px;text-align:left;cursor:pointer;color:var(--text);
    overflow:hidden;white-space:nowrap;display:flex;align-items:center;
  }
  .tapfld:active{background:#e2eaf4;}
  .tapfld > .txt{overflow:hidden;text-overflow:ellipsis;}
  .tapfld.ph{color:#9aa3ad;}
  .f-no{width:52px;justify-content:center;font-weight:700;font-variant-numeric:tabular-nums;}
  .f-truck{flex:1;min-width:0;justify-content:center;font-weight:700;font-size:15px;
           font-variant-numeric:tabular-nums;}
  .f-vol{width:82px;justify-content:flex-end;font-variant-numeric:tabular-nums;}
  .f-del{
    width:34px;min-height:36px;border:1px solid var(--line);border-radius:6px;background:#fff;
    color:#8c1c1c;cursor:pointer;font-size:15px;flex:none;
  }
  .chips{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;}
  .chip{
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
    min-height:56px;border:1px solid var(--line);border-radius:7px;background:var(--time-bg);
    cursor:pointer;padding:2px 1px;color:var(--text);
  }
  .chip:active{background:#dcefe0;}
  .chip > .lb{font-size:9.5px;color:var(--muted);white-space:nowrap;}
  .chip > .t{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;}
  .chip.empty{background:#fbfcfb;border-style:dashed;}
  .chip.empty > .t{color:#b4bcc5;font-weight:400;}
  .chip.bad > .t{color:#c00;font-size:12px;}
  .chip.on{border-color:var(--sel);box-shadow:0 0 0 2px rgba(28,110,208,.16);}
  .card-metrics{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px;}
  .mtr{
    font-size:11px;background:var(--calc-bg);border:1px solid #e0e6ec;border-radius:5px;
    padding:3px 7px;color:#3a4653;white-space:nowrap;
  }
  .mtr b{font-size:13px;font-variant-numeric:tabular-nums;margin-left:3px;}
  .mtr.warn{background:var(--warn);border-color:#e6cf8e;}
  .mtr.alert{background:var(--alert);border-color:#e3a3a3;font-weight:700;}
  .card-memo{
    display:flex;align-items:center;width:100%;margin-top:6px;font:inherit;font-size:12px;text-align:left;
    background:none;border:none;border-top:1px dashed var(--line);padding:6px 2px 0;
    color:#46515e;cursor:pointer;min-height:30px;
  }
  .card-memo.ph{color:#aab3bd;}

  /* ===== 表 ===== */
  .grid-wrap{overflow:auto;max-height:min(62vh,640px);}
  .grid-wrap:focus{outline:none;}
  table.grid{border-collapse:separate;border-spacing:0;width:100%;table-layout:fixed;}
  table.grid th,table.grid td{
    border-right:1px solid var(--line);border-bottom:1px solid var(--line);
    padding:0;height:30px;font-weight:normal;overflow:hidden;
  }
  table.grid thead th{
    position:sticky;top:0;z-index:3;background:var(--head);
    font-size:11.5px;line-height:1.25;text-align:center;padding:3px 2px;
    border-bottom:1px solid var(--line-strong);white-space:nowrap;
  }
  table.grid thead th .sub{display:block;font-size:9.5px;color:#5c6773;font-weight:normal;}
  table.grid thead th.g-time{background:#e3f0e3;}
  table.grid thead th.g-calc{background:var(--head2);}
  th.rowhead{
    position:sticky;left:0;z-index:2;background:var(--head);width:34px;min-width:34px;
    text-align:center;font-size:11px;color:var(--muted);cursor:pointer;
  }
  thead th.rowhead{z-index:4;}
  td.cell{text-align:center;cursor:cell;white-space:nowrap;font-variant-numeric:tabular-nums;}
  td.cell > .v{display:block;padding:0 5px;line-height:29px;height:29px;overflow:hidden;text-overflow:ellipsis;}
  td.t-text > .v{text-align:left;}
  td.t-num  > .v{text-align:right;}
  td.t-time > .v{font-size:14px;}
  td.t-time{background:var(--time-bg);}
  td.t-calc{background:var(--calc-bg);color:#243040;}
  td.auto > .v{color:#5a6472;}
  td.cell.sel{outline:2px solid var(--sel);outline-offset:-2px;background:#eaf3ff;}
  td.cell.sel.t-time{background:#e8f5ea;}
  td.warn{background:var(--warn);}
  td.alert{background:var(--alert);font-weight:700;}
  td.bad > .v{color:#c00;}
  input.editor{
    width:100%;height:100%;min-height:30px;border:none;padding:0 4px;font:inherit;font-size:16px;
    background:#fffbe6;text-align:center;outline:2px solid var(--sel);outline-offset:-2px;border-radius:4px;
  }
  td.t-text input.editor{text-align:left;}
  td.t-num input.editor{text-align:right;}
  .tapfld input.editor,.card-memo input.editor{text-align:left;height:30px;}
  .f-truck input.editor{text-align:center;}
  .f-vol input.editor{text-align:right;}

  /* ===== 時刻ピッカー ===== */
  #picker{
    position:absolute;z-index:50;display:none;background:#fff;
    border:1px solid var(--line-strong);border-radius:9px;box-shadow:0 8px 26px rgba(0,0,0,.25);
    min-width:198px;padding:6px;
  }
  #picker .pk-head{
    font-size:11px;color:var(--muted);padding:2px 6px 6px;border-bottom:1px dashed var(--line);
    margin-bottom:5px;text-align:center;
  }
  #picker button{
    display:block;width:100%;font:inherit;font-size:14px;text-align:left;border:1px solid transparent;
    background:none;padding:9px 10px;border-radius:6px;cursor:pointer;white-space:nowrap;color:var(--text);
  }
  #picker button:active{background:#e3edfa;}
  #picker button.on{background:#dceaff;border-color:#9ec2f0;}
  #picker button.now{
    font-size:19px;font-weight:700;text-align:center;background:#e9f6ec;border-color:#a9d3b4;padding:12px 8px;
  }
  #picker button .t{font-variant-numeric:tabular-nums;font-size:16px;}
  #picker button .lbl{color:var(--muted);font-size:11px;margin-left:8px;}
  #picker .pk-sep{border-top:1px dashed var(--line);margin:5px 0;}
  #picker .pk-foot{font-size:10.5px;color:#868f9a;text-align:center;padding:4px 2px 1px;line-height:1.45;}

  /* ===== 集計 ===== */
  .summary{padding:10px 10px 14px;border-top:2px solid var(--line-strong);background:#fafbfc;}
  .summary h2{
    font-size:11.5px;margin:0 0 8px;color:#4a5563;letter-spacing:.12em;
    display:flex;align-items:center;gap:8px;
  }
  .summary h2::after{content:"";flex:1;border-top:1px solid var(--line);}
  .summary h2 + .stats{margin-bottom:14px;}
  .stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:7px;}
  .stat{border:1px solid var(--line);background:#fff;border-radius:6px;padding:6px 9px;}
  .stat.key{border-color:#a9c3e0;background:#f5f9fe;}
  .stat .k{font-size:10.5px;color:var(--muted);display:block;white-space:nowrap;}
  .stat .n{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums;}
  .stat .n small{font-size:11px;font-weight:normal;color:var(--muted);margin-left:2px;}
  table.trucks{border-collapse:collapse;width:100%;font-size:12px;background:#fff;}
  table.trucks th,table.trucks td{border:1px solid var(--line);padding:5px 7px;white-space:nowrap;}
  table.trucks th{background:var(--head);font-size:11px;font-weight:normal;color:#3d4854;}
  table.trucks td{text-align:right;font-variant-numeric:tabular-nums;}
  table.trucks td:first-child{text-align:left;}
  .tw-wrap{overflow-x:auto;}
  .saveinfo{font-size:11px;color:#868f9a;padding:0 10px 14px;text-align:right;}

  /* ===== 表示切替 ===== */
  body[data-view="cards"] .grid-wrap{display:none;}
  body[data-view="cards"] .view-cards{display:flex;}
  body[data-view="table"] .view-cards{display:none;}
  body[data-view="table"] .grid-wrap{display:block;}
  @media (max-width:880px){
    body[data-view="auto"] .grid-wrap{display:none;}
    body[data-view="auto"] .view-cards{display:flex;}
    .sheet{border:none;}
    header.title-block h1{font-size:15px;letter-spacing:.18em;}
    .site-fields{gap:4px 14px;}
    .toolbar .hint,.toolbar .desk-only{display:none;}
    .stats{grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:6px;}
    .summary{padding-bottom:calc(14px + env(safe-area-inset-bottom));}
  }
  @media (min-width:881px){
    body[data-view="auto"] .view-cards{display:none;}
  }
  @media print{
    body{background:#fff;font-size:11px;}
    .toolbar,.saveinfo,#picker,.view-cards{display:none !important;}
    .sheet{border:none;margin:0;max-width:none;min-height:0;}
    .grid-wrap{overflow:visible;max-height:none;display:block !important;}
    thead th,th.rowhead{position:static;}
    @page{size:A4 landscape;margin:8mm;}
  }
</style>
</head>
<body data-view="auto">
<div class="sheet">

  <header class="title-block">
    <h1>生コンクリート打設管理表</h1>
    <div class="site-fields">
      <span class="fld big"><label>現場名</label><input id="h_site" placeholder="○○○○新築工事"></span>
      <span class="fld mid"><label>施工者名</label><input id="h_builder" placeholder="株式会社○○建設"></span>
    </div>
    <div class="site-fields" style="margin-top:5px;">
      <span class="fld sm"><label>打設日</label><input id="h_date" type="date"></span>
      <span class="fld sm2"><label>予定数量(m³)</label><input id="h_plan" inputmode="decimal" placeholder="120"></span>
    </div>
  </header>

  <div class="toolbar">
    <button id="btnAdd" class="primary">＋ 次の車を追加</button>
    <button id="btnAdd5" class="desk-only">＋5行</button>
    <button id="btnInsert" class="desk-only">↳ 選択行の下に挿入</button>
    <button id="btnDel" class="desk-only danger">行を削除</button>
    <span class="spacer"></span>
    <span class="hint">時刻の枠を押す → 現在時刻の候補／そのまま数字を打てば手入力</span>
    <button id="btnView">表示：自動</button>
    <button id="btnCsv">CSV</button>
    <button id="btnBackup">バックアップ</button>
    <button id="btnRestore">読込</button>
    <button id="btnPrint" class="desk-only">印刷</button>
    <button id="btnClear" class="danger">全消去</button>
    <input type="file" id="fileIn" accept=".json,application/json" hidden>
  </div>

  <div class="grid-wrap" id="gridWrap" tabindex="0">
    <table class="grid" id="grid"></table>
  </div>

  <div class="view-cards" id="cards"></div>

  <div class="summary">
    <h2>出荷・打設の状況</h2>
    <div class="stats" id="stats"></div>
    <h2>車両別（回転時間）</h2>
    <div class="tw-wrap"><table class="trucks" id="trucks"></table></div>
  </div>
  <div class="saveinfo" id="saveinfo"></div>
</div>

<div id="picker"></div>

<script>
"use strict";

/* ============================================================
   列定義（入力列＋自動計算列）
   ============================================================ */
const COLS = [
  {key:'no',      label:'納入番号',  type:'text', w:60,  ph:'No'},
  {key:'truck',   label:'車番',      type:'num',  w:80, ph:'車番', int:true},
  {key:'vol',     label:'積載量',    sub:'m³',    type:'num',  w:66, ph:'積載量', unit:' m³'},
  {key:'cum',     label:'累計数量',  sub:'m³',    type:'num',  w:76, auto:true},
  {key:'depart',  label:'発時間',    short:'発',       type:'time', w:76},
  {key:'arrive',  label:'着時間',    short:'着',       type:'time', w:76},
  {key:'ustart',  label:'荷卸開始',  short:'荷卸開始', type:'time', w:76},
  {key:'uend',    label:'荷卸終了',  short:'荷卸終了', type:'time', w:76},
  {key:'back',    label:'帰着時間',  short:'帰着',     type:'time', w:76},
  {key:'d_pitch', label:'出荷間隔',  sub:'前車の発→発',  type:'calc', w:82, m:'ピッチ'},
  {key:'d_tr',    label:'輸送時間',  sub:'発→着',        type:'calc', w:74, m:'輸送'},
  {key:'d_wait',  label:'待機時間',  sub:'着→荷卸開始',  type:'calc', w:84, m:'待機'},
  {key:'d_unld',  label:'荷卸時間',  sub:'開始→終了',    type:'calc', w:80, m:'荷卸'},
  {key:'d_back',  label:'帰着まで',  sub:'荷卸終了→帰着',type:'calc', w:88, m:'帰着まで'},
  {key:'d_done',  label:'発→荷卸完了',sub:'所要時間',    type:'calc', w:90},
  {key:'d_turn',  label:'回転時間',  sub:'発→帰着',      type:'calc', w:78, m:'回転'},
  {key:'memo',    label:'備考',      type:'text', w:150, ph:'備考'},
];
const TIME_COLS  = COLS.filter(c=>c.type==='time');
const CARD_FLDS  = ['no','truck','vol'];
const CARD_MTRS  = ['d_pitch','d_tr','d_wait','d_unld','d_back','d_turn'];
const COUNT_KEYS = ['truck','vol','depart','arrive','ustart','uend','back'];
/** 変更すると後続行の累計・出荷間隔に影響する項目 */
const CASCADE = new Set(['vol','cum','depart']);
const KEY_INDEX = {}; COLS.forEach((c,i)=>KEY_INDEX[c.key]=i);
const COL = {}; COLS.forEach(c=>COL[c.key]=c);

const STORE = 'namacon-dansetsu-v2';
const HEAD_IDS = ['h_site','h_builder','h_date','h_plan'];

/* ============================================================
   状態
   ============================================================ */
let rows = [];
let sel  = {r:0, key:'no'};
let editing = null;                       // {r, key, input, host, hidden[]}
let picker  = {open:false, r:0, key:'', idx:0, items:[]};
let tableRows = [];                       // [{tr, tds:{key:td}}]
let cardRows  = [];                       // [{art, cells:{key:el}, mtr}]
let built = {table:false, cards:false};
let rowCalc = [];                         // 各行の計算結果（recompute で更新）

const $ = id => document.getElementById(id);
const gridEl   = $('grid');
const cardsEl  = $('cards');
const pickerEl = $('picker');
const mqNarrow = window.matchMedia('(max-width:880px)');

function newRow(no){
  const o = {};
  COLS.forEach(c=>{ if(c.type!=='calc') o[c.key]=''; });
  o.no = no==null ? '' : String(no);
  return o;
}
function el(tag, cls, txt){
  const e = document.createElement(tag);
  if(cls) e.className = cls;
  if(txt!=null) e.textContent = txt;
  return e;
}

/* ============================================================
   時刻ユーティリティ
   ============================================================ */
const pad2 = n => String(n).padStart(2,'0');

/** 文字列 → 0時からの分。解釈できなければ null */
function parseTime(s){
  if(s==null) return null;
  let t = String(s).trim();
  if(!t) return null;
  t = t.replace(/[０-９]/g, ch=>String.fromCharCode(ch.charCodeAt(0)-0xFEE0))
       .replace(/[：。．\.\-ー時]/g,':')
       .replace(/分$/,'')
       .replace(/\s+/g,'');
  let m;
  if((m = t.match(/^(\d{1,2}):(\d{1,2})(?::\d{1,2})?$/))){
    const h=+m[1], mi=+m[2];
    return (h<=47 && mi<=59) ? (h%24)*60+mi : null;
  }
  if((m = t.match(/^(\d{3,4})$/))){          // 1234 → 12:34 ／ 934 → 9:34
    const v=m[1], h=+v.slice(0,v.length-2), mi=+v.slice(-2);
    return (h<=47 && mi<=59) ? (h%24)*60+mi : null;
  }
  if((m = t.match(/^(\d{1,2})$/))){          // 9 → 9:00
    const h=+m[1];
    return h<=47 ? (h%24)*60 : null;
  }
  return null;
}
const fmtTime = min => min==null ? '' : pad2(Math.floor(min/60)%24)+':'+pad2(min%60);

/** 全角数字を半角に。int の項目（車番）は数字以外を取り除く */
function normNum(s, intOnly){
  let t = String(s).replace(/[０-９．]/g, ch=>String.fromCharCode(ch.charCodeAt(0)-0xFEE0));
  return intOnly ? t.replace(/\D/g,'') : t.trim();
}

/** 経過分。日跨ぎは +24h として扱う */
function span(a,b){
  if(a==null||b==null) return null;
  let d = b-a;
  if(d<0) d += 1440;
  return d;
}
const fmtDur = d => d==null ? '' : Math.floor(d/60)+':'+pad2(d%60);
const nowMin = () => { const d=new Date(); return d.getHours()*60+d.getMinutes(); };
const round2 = n => Math.round(n*100)/100;

/* ============================================================
   計算
   ============================================================ */
/**
 * 全行の時刻解析・所要時間・累計数量を1回の走査でまとめて計算する。
 * 表示・集計はすべてこの結果を読むだけにして、入力のたびに
 * 何度も解析し直さないようにしている。
 */
function recompute(){
  rowCalc = new Array(rows.length);
  let run = 0, prevDep = null;
  for(let r=0;r<rows.length;r++){
    const o = rows[r];
    const dep=parseTime(o.depart), arr=parseTime(o.arrive), us=parseTime(o.ustart),
          ue =parseTime(o.uend),   bk =parseTime(o.back);
    const manual = (o.cum||'')!=='' ? parseFloat(o.cum) : NaN;
    let cumManual = false;
    if(!isNaN(manual)){ run = manual; cumManual = true; }
    else { const v = parseFloat(o.vol); if(!isNaN(v)) run += v; }
    const pitch = (dep!=null && prevDep!=null) ? span(prevDep, dep) : null;
    if(dep!=null) prevDep = dep;
    rowCalc[r] = {
      dep, arr, us, ue, bk,
      cum: run, cumManual,
      d_pitch: pitch,
      d_tr   : span(dep, arr),
      d_wait : span(arr, us),
      d_unld : span(us,  ue),
      d_back : span(ue,  bk),
      d_done : span(dep, ue),
      d_turn : span(dep, bk),
    };
  }
}
const calcRow = r => rowCalc[r];
const waitLevel = d => d==null ? '' : (d>=60 ? 'alert' : (d>=30 ? 'warn' : ''));

/** セルの表示文字と付加クラス */
function cellView(r, c, cv){
  const o = rows[r], key = c.key;
  let txt='', cls='';
  if(c.type==='calc'){
    const d = cv[key];
    txt = fmtDur(d);
    if(d!=null && d>720) cls += ' bad';               // 12時間超＝入力ミスの可能性
    if(key==='d_wait'){ const lv=waitLevel(d); if(lv) cls += ' '+lv; }
  }else if(key==='cum'){
    txt = ((o.vol||'')!=='' || cv.cumManual) ? String(round2(cv.cum)) : '';
    if(!cv.cumManual) cls += ' auto';
  }else{
    txt = o[key] ?? '';
    if(c.type==='time'){
      const p = parseTime(txt);
      if(p!=null) txt = fmtTime(p); else if(txt!=='') cls += ' bad';
    }
  }
  return {txt, cls};
}

/* ============================================================
   表示中のビュー（表 or カード）
   ============================================================ */
function activeView(){
  const v = document.body.dataset.view;
  if(v==='table' || v==='cards') return v;
  return mqNarrow.matches ? 'cards' : 'table';
}
/** 表示するビューだけを組み立てる（両方作ると更新が倍かかるため） */
function ensureBuilt(){
  const v = activeView();
  if(v==='table'){
    if(!built.table) buildTable();
    if(built.cards) dropCards();
  }else{
    if(!built.cards) buildCards();
    if(built.table) dropTable();
  }
  updateAll();
}
function dropTable(){ gridEl.textContent=''; tableRows=[]; built.table=false; }
function dropCards(){ cardsEl.textContent=''; cardRows=[]; built.cards=false; }
/** 行を増減したときだけ組み立て直す */
function rebuild(){
  if(!built.table && !built.cards){ ensureBuilt(); }
  else{
    if(built.table) buildTable();
    if(built.cards) buildCards();
    updateAll();
  }
  scheduleStats();
  save();
}

/* ---- 表の組み立て ---- */
function buildTable(){
  gridEl.textContent='';
  const cg = el('colgroup');
  const addCol = w => { const c=el('col'); c.style.width=w+'px'; cg.appendChild(c); };
  addCol(34); COLS.forEach(c=>addCol(c.w));
  gridEl.appendChild(cg);

  const thead = el('thead'), htr = el('tr');
  htr.appendChild(el('th','rowhead','No'));
  COLS.forEach(c=>{
    const th = el('th', c.type==='time' ? 'g-time' : (c.type==='calc' ? 'g-calc' : ''));
    th.appendChild(document.createTextNode(c.label));
    th.appendChild(el('span','sub', c.sub || ' '));
    htr.appendChild(th);
  });
  thead.appendChild(htr); gridEl.appendChild(thead);

  const tb = el('tbody');
  tableRows = rows.map((o,r)=>{
    const tr = el('tr');
    const th = el('th','rowhead', String(r+1));
    th.dataset.rowhead = r;
    tr.appendChild(th);
    const tds = {};
    COLS.forEach(c=>{
      const td = el('td');
      td.dataset.r = r; td.dataset.key = c.key;
      td.appendChild(el('span','v'));
      tds[c.key] = td;
      tr.appendChild(td);
    });
    tb.appendChild(tr);
    return {tr, tds};
  });
  gridEl.appendChild(tb);
  built.table = true;
}

/* ---- カードの組み立て ---- */
function buildCards(){
  cardsEl.textContent='';
  const frag = document.createDocumentFragment();
  cardRows = rows.map((o,r)=>{
    const art = el('article','card');
    art.dataset.r = r;
    const top = el('div','card-top');
    const cells = {};
    CARD_FLDS.forEach(key=>{
      const b = el('button','tapfld f-'+(key==='no'?'no':key==='truck'?'truck':'vol'));
      b.type='button'; b.dataset.r=r; b.dataset.key=key;
      b.appendChild(el('span','txt'));
      cells[key] = b;
      top.appendChild(b);
    });
    const del = el('button','f-del','✕');
    del.type='button'; del.dataset.del=r; del.setAttribute('aria-label','この車を削除');
    top.appendChild(del);
    art.appendChild(top);

    const chips = el('div','chips');
    TIME_COLS.forEach(c=>{
      const b = el('button','chip');
      b.type='button'; b.dataset.r=r; b.dataset.key=c.key;
      b.appendChild(el('span','lb', c.short));
      b.appendChild(el('span','t'));
      cells[c.key] = b;
      chips.appendChild(b);
    });
    art.appendChild(chips);

    const mtr = el('div','card-metrics');
    art.appendChild(mtr);

    const memo = el('button','card-memo');
    memo.type='button'; memo.dataset.r=r; memo.dataset.key='memo';
    memo.appendChild(el('span','txt'));
    cells.memo = memo;
    art.appendChild(memo);

    frag.appendChild(art);
    return {art, cells, mtr};
  });
  cardsEl.appendChild(frag);
  built.cards = true;
}

/* ============================================================
   更新（変更のあった箇所だけ書き換える）
   ============================================================ */
function setText(node, txt){ if(node.textContent!==txt) node.textContent = txt; }
function setCls(node, cls){ if(node.className!==cls) node.className = cls; }

function updateRow(r){
  const o = rows[r], cv = calcRow(r);
  const isSel = sel.r===r;

  const T = tableRows[r];
  if(T){
    COLS.forEach(c=>{
      const td = T.tds[c.key];
      const {txt, cls} = cellView(r, c, cv);
      if(!(editing && editing.r===r && editing.key===c.key)) setText(td.firstChild, txt);
      setCls(td, `cell t-${c.type}${cls}${isSel && sel.key===c.key ? ' sel' : ''}`);
    });
  }
  const C = cardRows[r];
  if(C){
    setCls(C.art, 'card' + (isSel ? ' is-sel' : ''));
    CARD_FLDS.concat('memo').forEach(key=>{
      if(editing && editing.r===r && editing.key===key) return;
      const c = COL[key], b = C.cells[key];
      const raw = (o[key]||'');
      const txt = raw==='' ? c.ph : raw + (c.unit||'');
      setText(b.firstChild, txt);
      const base = key==='memo' ? 'card-memo' : 'tapfld f-'+key;
      setCls(b, base + (raw==='' ? ' ph' : ''));
    });
    TIME_COLS.forEach(c=>{
      if(editing && editing.r===r && editing.key===c.key) return;
      const b = C.cells[c.key];
      const {txt, cls} = cellView(r, c, cv);
      setText(b.lastChild, txt || '―');
      setCls(b, 'chip'+(txt==='' ? ' empty' : '')+cls+
                (picker.open && picker.r===r && picker.key===c.key ? ' on' : ''));
    });
    // 所要時間の表示（変化したときだけ作り直す）
    const parts = [];
    if((o.vol||'')!=='' || cv.cumManual) parts.push(['','累計 '+round2(cv.cum)+' m³']);
    CARD_MTRS.forEach(k=>{
      const d = cv[k];
      if(d==null) return;
      parts.push([k==='d_wait' ? waitLevel(d) : '', COL[k].m, fmtDur(d)]);
    });
    const sig = parts.map(a=>a.join('')).join('');
    if(C.mtr.dataset.sig !== sig){
      C.mtr.dataset.sig = sig;
      C.mtr.textContent = '';
      parts.forEach(([lv, label, val])=>{
        const s = el('span','mtr'+(lv?' '+lv:''), label);
        if(val!=null) s.appendChild(el('b', null, val));
        C.mtr.appendChild(s);
      });
    }
  }
}
function updateAll(){
  recompute();
  for(let r=0;r<rows.length;r++) updateRow(r);
}

/** データ変更後：影響する行だけ更新し、集計と保存を予約する */
function refresh(from=0){
  recompute();
  for(let r=Math.max(0,from); r<rows.length; r++) updateRow(r);
  scheduleStats();
  save();
}
/** 1か所の変更を反映（累計・出荷間隔に響く項目だけ後続行も更新） */
function changed(r, key){
  if(CASCADE.has(key)){ refresh(r); return; }
  recompute();
  updateRow(r);
  scheduleStats();
  save();
}
let statsTimer = null;
function scheduleStats(){
  if(statsTimer) return;
  statsTimer = requestAnimationFrame(()=>{ statsTimer=null; renderStats(); });
}

/* ============================================================
   集計
   ============================================================ */
const avgOf = a => a.length ? Math.round(a.reduce((x,y)=>x+y,0)/a.length) : null;
function validDur(key){
  const out = [];
  for(let r=0;r<rowCalc.length;r++){ const d=rowCalc[r][key]; if(d!=null && d<=720) out.push(d); }
  return out;
}
/** 連続する時刻の間隔（出荷ピッチ・打設ピッチ） */
function pitches(key){
  const out = []; let prev = null;
  for(let r=0;r<rowCalc.length;r++){
    const t = rowCalc[r][key];
    if(t==null) continue;
    if(prev!=null){ const d=span(prev,t); if(d!=null && d<=720) out.push(d); }
    prev = t;
  }
  return out;
}
function renderStats(){
  const filled = rows.filter(o=>COUNT_KEYS.some(k=>(o[k]||'')!==''));
  const maxOf = a => a.length ? Math.max(...a) : null;

  let shipped = 0, poured = 0, firstStart = null, lastEnd = null;
  rows.forEach((o,r)=>{
    const c = rowCalc[r];
    const v = parseFloat(o.vol);
    if(!isNaN(v)){
      if(c.dep!=null) shipped += v;
      if(c.ue!=null)  poured  += v;
    }
    if(c.us!=null && (firstStart==null || c.us<firstStart)) firstStart = c.us;
    if(c.ue!=null && (lastEnd==null   || c.ue>lastEnd))     lastEnd   = c.ue;
  });

  let elapsed=null, pace=null;
  if(firstStart!=null && lastEnd!=null){
    elapsed = span(firstStart, lastEnd);
    if(elapsed>0 && poured>0) pace = poured/(elapsed/60);
  }
  const plan = parseFloat($('h_plan').value);
  const prog = (!isNaN(plan) && plan>0) ? Math.round(poured/plan*1000)/10 : null;
  const rest = (!isNaN(plan) && plan>0) ? round2(Math.max(0, plan-shipped)) : null;

  const turn = validDur('d_turn'), waits = validDur('d_wait');
  const cards = [
    ['台数',        filled.length, '台', ''],
    ['出荷数量',    round2(shipped), 'm³', ''],
    ['打設済数量',  round2(poured),  'm³', ''],
    ['未出荷',      rest==null?'―':rest, rest==null?'':'m³', ''],
    ['進捗率',      prog==null?'―':prog, prog==null?'':'%', ''],
    ['平均出荷ピッチ', fmtDur(avgOf(pitches('dep')))||'―', '', 'key'],
    ['平均回転時間',   fmtDur(avgOf(turn))||'―', '', 'key'],
    ['最短／最長回転', turn.length ? `${fmtDur(Math.min(...turn))} / ${fmtDur(Math.max(...turn))}` : '―', '', ''],
    ['平均輸送時間',   fmtDur(avgOf(validDur('d_tr')))||'―', '', ''],
    ['平均待機時間',   fmtDur(avgOf(waits))||'―', '', ''],
    ['最大待機時間',   fmtDur(maxOf(waits))||'―', '', waitLevel(maxOf(waits))==='alert'?'key':''],
    ['平均荷卸時間',   fmtDur(avgOf(validDur('d_unld')))||'―', '', ''],
    ['打設ピッチ',     fmtDur(avgOf(pitches('us')))||'―', '', ''],
    ['打設所要時間',   fmtDur(elapsed)||'―', '', 'key'],
    ['打設ペース',     pace==null?'―':Math.round(pace*10)/10, pace==null?'':'m³/h', 'key'],
  ];
  const html = cards.map(([k,n,u,cls])=>
    `<div class="stat ${cls}"><span class="k">${k}</span><span class="n">${n}${u?`<small>${u}</small>`:''}</span></div>`
  ).join('');
  if($('stats').innerHTML !== html) $('stats').innerHTML = html;
  renderTrucks();
}
/** 車両別の回転時間 */
function renderTrucks(){
  const map = new Map();
  rows.forEach((o,r)=>{
    const name = (o.truck||'').trim();
    if(!name) return;
    if(!map.has(name)) map.set(name, {n:0, vol:0, turn:[], wait:[]});
    const e = map.get(name), cv = rowCalc[r];
    if(cv.dep!=null){
      e.n++;
      const v = parseFloat(o.vol); if(!isNaN(v)) e.vol += v;
    }
    if(cv.d_turn!=null && cv.d_turn<=720) e.turn.push(cv.d_turn);
    if(cv.d_wait!=null && cv.d_wait<=720) e.wait.push(cv.d_wait);
  });
  let html;
  if(!map.size){
    html = '<tbody><tr><td style="text-align:left;color:#868f9a;">車番を入力すると、車両ごとの回転時間を集計します。</td></tr></tbody>';
  }else{
    html = '<thead><tr><th style="text-align:left">車番</th><th>運搬回数</th><th>運搬量</th>'+
           '<th>平均回転</th><th>最短</th><th>最長</th><th>平均待機</th></tr></thead><tbody>';
    map.forEach((e,name)=>{
      html += `<tr><td>${escapeHtml(name)}</td><td>${e.n}</td><td>${round2(e.vol)}</td>`+
              `<td>${fmtDur(avgOf(e.turn))||'―'}</td>`+
              `<td>${e.turn.length?fmtDur(Math.min(...e.turn)):'―'}</td>`+
              `<td>${e.turn.length?fmtDur(Math.max(...e.turn)):'―'}</td>`+
              `<td>${fmtDur(avgOf(e.wait))||'―'}</td></tr>`;
    });
    html += '</tbody>';
  }
  if($('trucks').innerHTML !== html) $('trucks').innerHTML = html;
}
function escapeHtml(s){
  return String(s).replace(/[&<>"]/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
}

/* ============================================================
   選択
   ============================================================ */
function hostOf(r, key){
  const T = tableRows[r]; if(T) return T.tds[key];
  const C = cardRows[r];  if(C) return C.cells[key];
  return null;
}
function select(r, key, {scroll=false}={}){
  r = Math.max(0, Math.min(rows.length-1, r));
  const prev = sel;
  sel = {r, key};
  if(prev.r!==r) updateRow(prev.r);
  updateRow(r);
  if(scroll){
    const host = hostOf(r, key);
    if(host) host.scrollIntoView({block:'nearest', inline:'nearest'});
  }
}
function move(dr, dc){
  closePicker(); commitEdit();
  let r = sel.r, c = KEY_INDEX[sel.key] + dc;
  r += dr;
  if(c<0){ c=COLS.length-1; r--; }
  if(c>COLS.length-1){ c=0; r++; }
  if(r<0) r=0;
  if(r>rows.length-1){ if(dr>0||dc>0){ addRow(); } r=Math.min(r, rows.length-1); }
  select(r, COLS[c].key, {scroll:true});
}

/* ============================================================
   編集（文字入力モード）
   ============================================================ */
function beginEdit(r, key, initial){
  const col = COL[key];
  if(!col || col.type==='calc') return;
  closePicker();
  if(editing && editing.r===r && editing.key===key){ editing.input.focus(); return; }
  commitEdit();
  const host = hostOf(r, key);
  if(!host) return;

  const inp = el('input','editor');
  inp.type = 'text';
  inp.autocomplete = 'off';
  if(col.type==='num') inp.inputMode = col.int ? 'numeric' : 'decimal';
  else if(col.type==='time') inp.inputMode='numeric';
  inp.value = (initial!=null && initial!=='') ? initial : (rows[r][key] ?? '');

  const hidden = [];
  [...host.children].forEach(ch=>{ if(ch.style.display!=='none'){ ch.style.display='none'; hidden.push(ch); } });
  host.appendChild(inp);
  editing = {r, key, input:inp, host, hidden};
  sel = {r, key};

  inp.focus();
  if(initial!=null && initial!=='') inp.setSelectionRange(inp.value.length, inp.value.length);
  else inp.select();

  inp.addEventListener('keydown', e=>{
    e.stopPropagation();
    if(e.key==='Enter'){ e.preventDefault(); const t=tableRows.length>0; commitEdit(); if(t) move(1,0); }
    else if(e.key==='Escape'){ e.preventDefault(); cancelEdit(); }
    else if(e.key==='Tab'){ e.preventDefault(); const t=tableRows.length>0; commitEdit(); if(t) move(0, e.shiftKey?-1:1); }
  });
  // blur による確定は一拍遅らせる（次に押した枠のタップを取りこぼさないため）
  inp.addEventListener('blur', ()=>{
    setTimeout(()=>{ if(editing && editing.input===inp) commitEdit(); }, 0);
  });
}
function closeEditor(){
  if(!editing) return null;
  const {host, input, hidden} = editing;
  if(input.parentNode===host) host.removeChild(input);
  hidden.forEach(ch=>{ ch.style.display=''; });
  const e = editing;
  editing = null;
  return e;
}
function commitEdit(){
  if(!editing) return;
  const {r, key, input} = editing;
  const col = COL[key];
  let v = input.value.trim();
  if(col.type==='time'){
    const p = parseTime(v);
    if(p!=null) v = fmtTime(p);            // 9 ／ 934 ／ 9:34 → 09:34 に整形
  }else if(col.type==='num'){
    v = normNum(v, col.int);               // 車番は数字だけ
  }
  closeEditor();
  if(rows[r][key] === v){ updateRow(r); return; }
  rows[r][key] = v;
  changed(r, key);
}
function cancelEdit(){
  if(!editing) return;
  const {r} = editing;
  closeEditor();
  updateRow(r);
}

/* ============================================================
   時刻ピッカー
   ============================================================ */
const OFFSETS = [0,-1,-2,-3,-5,-10];

function openPicker(r, key){
  commitEdit();
  const base = nowMin();
  picker.items = OFFSETS.map(off=>({min:(base+off+1440)%1440, off}));
  picker.open=true; picker.r=r; picker.key=key; picker.idx=0;
  drawPicker();
  pickerEl.style.display='block';
  updateRow(r);
  positionPicker();
}
function positionPicker(){
  if(!picker.open) return;
  const a = hostOf(picker.r, picker.key);
  if(!a || !a.isConnected){ closePicker(); return; }
  const rect = a.getBoundingClientRect();
  const wrap = a.closest('.grid-wrap');
  if(wrap){
    const wr = wrap.getBoundingClientRect();
    if(rect.right<wr.left || rect.left>wr.right || rect.bottom<wr.top || rect.top>wr.bottom){
      closePicker(); return;
    }
  }
  const vw = document.documentElement.clientWidth;
  const vh = document.documentElement.clientHeight;
  const pw = pickerEl.offsetWidth, ph = pickerEl.offsetHeight;
  let left = rect.left + rect.width/2 - pw/2;
  let top  = rect.bottom + 4;
  if(left + pw > vw - 6) left = vw - pw - 6;
  if(top + ph > vh - 4)  top = (rect.top > ph + 6) ? rect.top - ph - 4 : Math.max(4, vh - ph - 4);
  pickerEl.style.left = Math.max(4, left) + window.scrollX + 'px';
  pickerEl.style.top  = Math.max(4, top)  + window.scrollY + 'px';
}
let posTimer = null;
function schedulePosition(){
  if(!picker.open || posTimer) return;
  posTimer = requestAnimationFrame(()=>{ posTimer=null; positionPicker(); });
}
function drawPicker(){
  const o = rows[picker.r];
  const cur = o[picker.key] || '';
  const who = (o.truck||'').trim() || (o.no ? `納入番号 ${o.no}` : '');
  let h = `<div class="pk-head">${COL[picker.key].label}${who?`　${escapeHtml(who)}`:''}`+
          `${cur?`<br>現在の入力：${escapeHtml(cur)}`:''}</div>`;
  picker.items.forEach((it,i)=>{
    if(it.off===0){
      h += `<button type="button" data-i="${i}" class="now${i===picker.idx?' on':''}">現在時刻　${fmtTime(it.min)}</button>`;
      h += '<div class="pk-sep"></div>';
    }else{
      h += `<button type="button" data-i="${i}" class="${i===picker.idx?'on':''}">`+
           `<span class="t">${fmtTime(it.min)}</span><span class="lbl">${-it.off}分前</span></button>`;
    }
  });
  h += '<div class="pk-sep"></div>'+
       '<button type="button" data-act="manual">✎ 手入力する…</button>'+
       '<button type="button" data-act="clear">✕ 消去</button>'+
       '<div class="pk-foot">数字を打つとそのまま手入力モード<br>Enter…選択　Esc…閉じる</div>';
  pickerEl.innerHTML = h;
}
function closePicker(){
  if(!picker.open) return;
  const r = picker.r;
  picker.open = false;
  pickerEl.style.display = 'none';
  updateRow(r);
}
function setTime(r, key, value){
  if(rows[r][key] === value) return;
  rows[r][key] = value;
  changed(r, key);
}

pickerEl.addEventListener('mousedown', e=>{
  const b = e.target.closest('button');
  if(!b) return;
  e.preventDefault();
  const {r, key} = picker;
  if(b.dataset.act==='manual'){ closePicker(); beginEdit(r, key); return; }
  if(b.dataset.act==='clear'){  closePicker(); setTime(r, key, ''); return; }
  const it = picker.items[+b.dataset.i];
  closePicker();
  setTime(r, key, fmtTime(it.min));
});

/* ============================================================
   操作
   ============================================================ */
function onPress(r, key){
  const col = COL[key];
  if(!col || col.type==='calc') return;
  const wasOpen = picker.open && picker.r===r && picker.key===key;
  closePicker();
  if(col.type==='time'){
    commitEdit();
    select(r, key);
    if(!wasOpen) openPicker(r, key);
  }else{
    beginEdit(r, key);        // 1回押すだけで入力欄が開く（日本語入力もそのまま）
  }
}
function onGridPress(e){
  const rh = e.target.closest('th[data-rowhead]');
  if(rh){ commitEdit(); closePicker(); select(+rh.dataset.rowhead, 'no'); return; }
  const td = e.target.closest('td[data-key]');
  if(!td) return;
  const r = +td.dataset.r, key = td.dataset.key;
  if(editing && editing.r===r && editing.key===key) return;
  e.preventDefault();
  $('gridWrap').focus({preventScroll:true});
  onPress(r, key);
}
gridEl.addEventListener('mousedown', onGridPress);
gridEl.addEventListener('dblclick', e=>{        // 時刻セルもダブルクリックで手入力
  const td = e.target.closest('td[data-key]');
  if(!td) return;
  const key = td.dataset.key;
  if(COL[key].type==='calc') return;
  closePicker();
  beginEdit(+td.dataset.r, key);
});

cardsEl.addEventListener('click', e=>{
  if(e.target.closest('input.editor')) return;
  const del = e.target.closest('[data-del]');
  if(del){ deleteRow(+del.dataset.del); return; }
  const b = e.target.closest('button[data-key]');
  if(!b) return;
  const r = +b.dataset.r, key = b.dataset.key;
  if(editing && editing.r===r && editing.key===key) return;
  onPress(r, key);
});

document.addEventListener('mousedown', e=>{
  if(!picker.open) return;
  if(pickerEl.contains(e.target)) return;
  if(e.target.closest('td[data-key]') || e.target.closest('.chip')) return;
  closePicker();
});

document.addEventListener('keydown', e=>{
  if(editing) return;
  const tag = (e.target.tagName||'').toLowerCase();
  if(tag==='input' && !e.target.classList.contains('editor')) return;   // ヘッダー入力中

  if(picker.open){
    const n = picker.items.length;
    if(e.key==='ArrowDown'){ e.preventDefault(); picker.idx=(picker.idx+1)%n; drawPicker(); return; }
    if(e.key==='ArrowUp'){   e.preventDefault(); picker.idx=(picker.idx-1+n)%n; drawPicker(); return; }
    if(e.key==='Enter'){
      e.preventDefault();
      const {r,key}=picker, it=picker.items[picker.idx];
      closePicker(); setTime(r, key, fmtTime(it.min)); return;
    }
    if(e.key==='Escape'){ e.preventDefault(); closePicker(); return; }
    if(e.key==='Tab'){    e.preventDefault(); closePicker(); move(0, e.shiftKey?-1:1); return; }
    if(e.key==='Delete'||e.key==='Backspace'){
      e.preventDefault();
      const {r,key}=picker; closePicker(); setTime(r, key, ''); return;
    }
    // 入力しようとした ＝ 現在時刻ではないと判断 → 文字入力モードへ
    if(e.key.length===1 && !e.ctrlKey && !e.metaKey && !e.altKey){
      e.preventDefault();
      const {r,key}=picker;
      closePicker();
      beginEdit(r, key, e.key);
      return;
    }
    return;
  }

  if(!tableRows.length) return;              // 表を表示していないときは何もしない
  switch(e.key){
    case 'ArrowUp':    e.preventDefault(); move(-1,0); return;
    case 'ArrowDown':  e.preventDefault(); move(1,0);  return;
    case 'ArrowLeft':  e.preventDefault(); move(0,-1); return;
    case 'ArrowRight': e.preventDefault(); move(0,1);  return;
    case 'Tab':        e.preventDefault(); move(0, e.shiftKey?-1:1); return;
    case 'Enter':      e.preventDefault(); onPress(sel.r, sel.key); return;
    case 'F2':         e.preventDefault(); beginEdit(sel.r, sel.key); return;
    case 'Delete': case 'Backspace':
      e.preventDefault();
      if(COL[sel.key].type!=='calc' && rows[sel.r][sel.key]!==''){
        rows[sel.r][sel.key]='';
        changed(sel.r, sel.key);
      }
      return;
    case 'Escape': closePicker(); return;
  }
  if(e.key.length===1 && !e.ctrlKey && !e.metaKey && !e.altKey){
    e.preventDefault();
    beginEdit(sel.r, sel.key, e.key);
  }
});

/* ============================================================
   行操作
   ============================================================ */
function nextNo(){
  let mx = 0;
  rows.forEach(o=>{ const n=parseInt(o.no,10); if(!isNaN(n)&&n>mx) mx=n; });
  return mx+1;
}
function addRow(n=1){
  for(let i=0;i<n;i++) rows.push(newRow(nextNo()));
  rebuild();
}
function deleteRow(r){
  commitEdit(); closePicker();
  const o = rows[r];
  const has = COUNT_KEYS.some(k=>(o[k]||'')!=='');
  const name = (o.truck||'').trim() || `${r+1}行目`;
  if(has && !confirm(`${name} の記録を削除します。よろしいですか？`)) return;
  rows.splice(r,1);
  if(!rows.length) rows=[newRow(1)];
  if(sel.r>=rows.length) sel.r = rows.length-1;
  rebuild();
}
$('btnAdd').onclick = ()=>{
  commitEdit(); closePicker();
  addRow(1);
  const r = rows.length-1;
  select(r, 'truck');
  const host = hostOf(r, 'truck');
  if(host) host.scrollIntoView({block:'center', behavior:'smooth'});
};
$('btnAdd5').onclick   = ()=>{ commitEdit(); closePicker(); addRow(5); };
$('btnInsert').onclick = ()=>{
  commitEdit(); closePicker();
  rows.splice(sel.r+1, 0, newRow(''));
  rebuild();
  select(sel.r+1, 'no');
};
$('btnDel').onclick   = ()=>deleteRow(sel.r);
$('btnPrint').onclick = ()=>{
  commitEdit(); closePicker();
  if(!built.table){ buildTable(); updateAll(); }   // 印刷は表の体裁で
  window.print();
  ensureBuilt();                                   // 印刷用に組んだ分を片づける
};
$('btnClear').onclick = ()=>{
  commitEdit(); closePicker();
  if(!confirm('入力内容をすべて消去します。よろしいですか？')) return;
  HEAD_IDS.forEach(id=>{ $(id).value=''; });
  $('h_date').value = new Date().toISOString().slice(0,10);
  rows = Array.from({length:5},(_,i)=>newRow(i+1));
  sel = {r:0, key:'no'};
  rebuild();
};

/* ---- 表示切替 ---- */
const VIEWS = [['auto','自動'],['cards','カード'],['table','表']];
function setView(v){
  document.body.dataset.view = v;
  $('btnView').textContent = '表示：' + (VIEWS.find(x=>x[0]===v)||VIEWS[0])[1];
  try{ localStorage.setItem(STORE+':view', v); }catch(_){}
  closePicker();
  ensureBuilt();
}
$('btnView').onclick = ()=>{
  commitEdit();
  const i = VIEWS.findIndex(x=>x[0]===document.body.dataset.view);
  setView(VIEWS[(i+1)%VIEWS.length][0]);
};
mqNarrow.addEventListener('change', ()=>{ if(document.body.dataset.view==='auto') ensureBuilt(); });

/* ============================================================
   CSV出力
   ============================================================ */
$('btnCsv').onclick = ()=>{
  commitEdit(); closePicker();
  const q = s => `"${String(s??'').replace(/"/g,'""')}"`;
  const L = [];
  L.push([q('現場名'),q($('h_site').value),q('施工者名'),q($('h_builder').value)].join(','));
  L.push([q('打設日'),q($('h_date').value),q('予定数量(m³)'),q($('h_plan').value)].join(','));
  L.push('');
  L.push(COLS.map(c=>q(c.label+(c.sub?`(${c.sub})`:''))).join(','));
  rows.forEach((o,r)=>{
    const cv = calcRow(r);
    L.push(COLS.map(c=>{
      if(c.type==='calc') return q(fmtDur(cv[c.key]));
      if(c.key==='cum')   return q(((o.vol||'')!=='' || cv.cumManual) ? round2(cv.cum) : '');
      return q(o[c.key]);
    }).join(','));
  });
  downloadBlob(new Blob(['﻿'+L.join('\r\n')], {type:'text/csv;charset=utf-8;'}), fileStem()+'.csv');
};

/* ============================================================
   バックアップ
   ============================================================ */
function fileStem(){
  const d = $('h_date').value || new Date().toISOString().slice(0,10);
  const site = ($('h_site').value||'現場').replace(/[\\\/:*?"<>|]/g,'_');
  return `打設管理_${site}_${d}`;
}
function downloadBlob(blob, name){
  const url = URL.createObjectURL(blob);
  const a = el('a'); a.href=url; a.download=name; a.style.display='none';
  document.body.appendChild(a);
  a.click();
  setTimeout(()=>{ a.remove(); URL.revokeObjectURL(url); }, 1000);
}
$('btnBackup').onclick = ()=>{
  commitEdit(); closePicker();
  const head={}; HEAD_IDS.forEach(id=>head[id]=$(id).value);
  downloadBlob(new Blob([JSON.stringify({app:'namacon-dansetsu', ver:2, head, rows}, null, 1)],
               {type:'application/json'}), fileStem()+'.json');
};
$('btnRestore').onclick = ()=>{ $('fileIn').value=''; $('fileIn').click(); };
$('fileIn').addEventListener('change', e=>{
  const f = e.target.files && e.target.files[0];
  if(!f) return;
  const rd = new FileReader();
  rd.onload = ()=>{
    let d=null;
    try{ d = JSON.parse(rd.result); }catch(_){}
    if(!d || !Array.isArray(d.rows)){ alert('読み込めるデータがありません。'); return; }
    if(!confirm('現在の入力内容を、読み込んだ内容で置き換えます。よろしいですか？')) return;
    rows = d.rows.map(o=>Object.assign(newRow(''), o));
    if(!rows.length) rows=[newRow(1)];
    if(d.head) HEAD_IDS.forEach(id=>{ if(d.head[id]!=null) $(id).value=d.head[id]; });
    sel = {r:0, key:'no'};
    rebuild();
  };
  rd.readAsText(f);
});

/* ============================================================
   保存・復元
   ============================================================ */
let saveTimer=null, lastSave=0;
function doSave(){
  clearTimeout(saveTimer); saveTimer=null;
  lastSave = Date.now();
  const head={}; HEAD_IDS.forEach(id=>head[id]=$(id).value);
  try{
    localStorage.setItem(STORE, JSON.stringify({head, rows}));
    const t=new Date();
    $('saveinfo').textContent = `自動保存済み（${pad2(t.getHours())}:${pad2(t.getMinutes())}）／この端末に保存されます`;
  }catch(_){
    $('saveinfo').textContent = '※ 自動保存に失敗しました。バックアップ保存をご利用ください';
  }
}
/** 連続入力中でも保存が先送りされ続けないよう、一定間隔で必ず書き込む */
function save(){
  if(Date.now()-lastSave > 1000){ doSave(); return; }
  if(!saveTimer) saveTimer = setTimeout(doSave, 400);
}
window.addEventListener('beforeunload', doSave);
window.addEventListener('pagehide', doSave);
document.addEventListener('visibilitychange', ()=>{ if(document.hidden) doSave(); });

function load(){
  let d=null;
  try{ d = JSON.parse(localStorage.getItem(STORE)||'null'); }catch(_){}
  if(d && Array.isArray(d.rows) && d.rows.length){
    rows = d.rows.map(o=>Object.assign(newRow(''), o));
    if(d.head) HEAD_IDS.forEach(id=>{ if(d.head[id]!=null) $(id).value=d.head[id]; });
  }else{
    rows = Array.from({length:5},(_,i)=>newRow(i+1));
    $('h_date').value = new Date().toISOString().slice(0,10);
  }
  let v='auto';
  try{ v = localStorage.getItem(STORE+':view') || 'auto'; }catch(_){}
  document.body.dataset.view = VIEWS.some(x=>x[0]===v) ? v : 'auto';
  $('btnView').textContent = '表示：' + (VIEWS.find(x=>x[0]===document.body.dataset.view)||VIEWS[0])[1];
}
HEAD_IDS.forEach(id=>$(id).addEventListener('input', ()=>{ save(); scheduleStats(); }));

/* ============================================================
   起動
   ============================================================ */
load();
recompute();
ensureBuilt();
renderStats();
window.addEventListener('resize', schedulePosition);
window.addEventListener('scroll', schedulePosition, {passive:true});
$('gridWrap').addEventListener('scroll', schedulePosition, {passive:true});
</script>
