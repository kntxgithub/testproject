<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>生コン打設管理</title>
<style>
  :root{
    --line:#b9c0c9;
    --line-strong:#7c8794;
    --head:#e8eef5;
    --head2:#dbe5f0;
    --calc-bg:#f4f7fa;
    --sel:#1c6ed0;
    --warn:#fff4d6;
    --alert:#ffe0e0;
    --text:#16202b;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:"Meiryo","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
    background:#eef1f5;color:var(--text);font-size:13px;
    -webkit-text-size-adjust:100%;
  }
  .sheet{
    max-width:1500px;margin:10px auto 40px;background:#fff;
    border:1px solid var(--line-strong);box-shadow:0 1px 6px rgba(0,0,0,.12);
  }

  /* ===== 帳票ヘッダー（センタリング） ===== */
  header.title-block{padding:14px 12px 10px;text-align:center;border-bottom:2px solid var(--line-strong);}
  header.title-block h1{
    font-size:20px;margin:0 0 10px;letter-spacing:.35em;font-weight:700;
  }
  .site-fields{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 22px;}
  .fld{display:inline-flex;align-items:baseline;gap:6px;}
  .fld > label{font-size:12px;color:#4a5563;white-space:nowrap;}
  .fld > input{
    font:inherit;text-align:center;border:none;border-bottom:1px solid var(--line);
    background:transparent;padding:2px 4px;color:var(--text);
  }
  .fld > input:focus{outline:none;border-bottom:2px solid var(--sel);background:#f2f7ff;}
  .fld.big > input{font-size:16px;font-weight:700;min-width:230px;}
  .fld.mid > input{font-size:14px;min-width:150px;}
  .fld.sm  > input{width:100px;}

  /* ===== ツールバー ===== */
  .toolbar{
    display:flex;flex-wrap:wrap;gap:6px;align-items:center;
    padding:7px 10px;background:#f6f8fa;border-bottom:1px solid var(--line);
  }
  .toolbar button{
    font:inherit;padding:5px 11px;border:1px solid var(--line-strong);border-radius:4px;
    background:linear-gradient(#fff,#eef1f5);cursor:pointer;
  }
  .toolbar button:hover{background:linear-gradient(#fff,#dce6f2);}
  .toolbar button:active{background:#cfdcea;}
  .toolbar .spacer{flex:1;}
  .toolbar .hint{color:#5b6672;font-size:11.5px;}
  .toolbar button.danger{color:#8c1c1c;border-color:#c99;}

  /* ===== 表 ===== */
  .grid-wrap{overflow:auto;max-height:62vh;}
  .grid-wrap:focus{outline:none;}
  table.grid{border-collapse:separate;border-spacing:0;width:100%;table-layout:fixed;}
  table.grid th,table.grid td{
    border-right:1px solid var(--line);border-bottom:1px solid var(--line);
    padding:0;height:30px;font-weight:normal;overflow:hidden;
  }
  table.grid thead th{
    position:sticky;top:0;z-index:3;background:var(--head);
    font-size:11.5px;line-height:1.25;text-align:center;padding:3px 2px;
    border-bottom:1px solid var(--line-strong);white-space:nowrap;
  }
  table.grid thead th .sub{display:block;font-size:9.5px;color:#5c6773;font-weight:normal;}
  table.grid thead th.g-time{background:#e3f0e3;}
  table.grid thead th.g-calc{background:var(--head2);}
  th.rowhead{
    position:sticky;left:0;z-index:2;background:var(--head);width:34px;min-width:34px;
    text-align:center;font-size:11px;color:#5c6773;cursor:pointer;
  }
  thead th.rowhead{z-index:4;}
  td.cell{text-align:center;cursor:cell;white-space:nowrap;font-variant-numeric:tabular-nums;}
  td.cell .v{display:block;padding:0 5px;line-height:29px;height:29px;overflow:hidden;text-overflow:ellipsis;}
  td.t-text .v{text-align:left;}
  td.t-num  .v{text-align:right;}
  td.t-time .v{font-size:14px;letter-spacing:.02em;}
  td.t-time{background:#f7fcf7;}
  td.t-calc{background:var(--calc-bg);color:#243040;}
  td.auto  .v{color:#5a6472;}
  td.cell.sel{outline:2px solid var(--sel);outline-offset:-2px;background:#eaf3ff;}
  td.cell.sel.t-time{background:#e8f5ea;}
  td.warn{background:var(--warn)!important;}
  td.alert{background:var(--alert)!important;font-weight:700;}
  td.bad .v{color:#c00;}
  tbody tr:nth-child(even) td.cell{background-image:linear-gradient(rgba(0,0,0,.012),rgba(0,0,0,.012));}
  td.cell input.editor{
    width:100%;height:29px;border:none;padding:0 4px;font:inherit;font-size:14px;
    background:#fffbe6;text-align:center;outline:2px solid var(--sel);outline-offset:-2px;
  }
  td.t-text input.editor{text-align:left;}
  td.t-num input.editor{text-align:right;}

  tfoot td,tfoot th{
    position:sticky;bottom:0;background:#e8eef5;border-top:2px solid var(--line-strong);
    font-weight:700;text-align:center;font-size:12px;height:28px;
  }

  /* ===== 時刻ピッカー ===== */
  #picker{
    position:absolute;z-index:50;display:none;background:#fff;
    border:1px solid var(--line-strong);border-radius:6px;box-shadow:0 6px 20px rgba(0,0,0,.22);
    min-width:186px;padding:5px;
  }
  #picker .pk-head{
    font-size:11px;color:#5b6672;padding:2px 6px 5px;border-bottom:1px dashed var(--line);
    margin-bottom:4px;text-align:center;
  }
  #picker button{
    display:block;width:100%;font:inherit;text-align:left;border:1px solid transparent;
    background:none;padding:5px 9px;border-radius:4px;cursor:pointer;white-space:nowrap;
  }
  #picker button:hover{background:#eef4fc;}
  #picker button.on{background:#dceaff;border-color:#9ec2f0;}
  #picker button.now{font-size:17px;font-weight:700;text-align:center;background:#e9f6ec;border-color:#a9d3b4;}
  #picker button.now:hover{background:#d6efdd;}
  #picker button .t{font-variant-numeric:tabular-nums;font-size:15px;}
  #picker button .lbl{color:#68727e;font-size:11px;margin-left:7px;}
  #picker .pk-sep{border-top:1px dashed var(--line);margin:4px 0;}
  #picker .pk-foot{font-size:10.5px;color:#78828e;text-align:center;padding:3px 2px 1px;line-height:1.4;}

  .summary{padding:9px 12px 13px;border-top:2px solid var(--line-strong);background:#fafbfc;}
  .summary h2{font-size:12px;margin:0 0 7px;color:#4a5563;letter-spacing:.1em;}
  .stats{display:flex;flex-wrap:wrap;gap:7px;}
  .stat{border:1px solid var(--line);background:#fff;border-radius:5px;padding:5px 11px;min-width:106px;}
  .stat .k{font-size:10.5px;color:#68727e;display:block;}
  .stat .n{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;}
  .stat .n small{font-size:11px;font-weight:normal;color:#68727e;margin-left:2px;}
  .saveinfo{font-size:11px;color:#78828e;padding:0 12px 10px;text-align:right;}

  @media print{
    body{background:#fff;font-size:11px;}
    .toolbar,.saveinfo,#picker{display:none!important;}
    .sheet{border:none;box-shadow:none;margin:0;max-width:none;}
    .grid-wrap{overflow:visible;max-height:none;}
    thead th{position:static;}
    tfoot td,tfoot th{position:static;}
    th.rowhead{position:static;}
    @page{size:A4 landscape;margin:8mm;}
  }
</style>
</head>
<body>
<div class="sheet">

  <header class="title-block">
    <h1>生コンクリート打設管理表</h1>
    <div class="site-fields">
      <span class="fld big"><label>現場名</label><input id="h_site" placeholder="○○○○新築工事"></span>
      <span class="fld mid"><label>施工者名</label><input id="h_builder" placeholder="株式会社○○建設"></span>
    </div>
    <div class="site-fields" style="margin-top:6px;">
      <span class="fld sm"><label>打設日</label><input id="h_date" type="date"></span>
      <span class="fld sm"><label>打設箇所</label><input id="h_part" placeholder="1F 床・梁"></span>
      <span class="fld sm"><label>生コン工場</label><input id="h_plant" placeholder="○○生コン"></span>
      <span class="fld sm"><label>配合</label><input id="h_mix" placeholder="24-18-20N"></span>
      <span class="fld sm"><label>予定数量(m³)</label><input id="h_plan" inputmode="decimal" placeholder="120"></span>
      <span class="fld sm"><label>天候</label><input id="h_weather" placeholder="晴"></span>
    </div>
  </header>

  <div class="toolbar">
    <button id="btnAdd">＋ 行を追加</button>
    <button id="btnAdd5">＋5行</button>
    <button id="btnInsert">↳ 選択行の下に挿入</button>
    <button id="btnDel" class="danger">行を削除</button>
    <span class="spacer"></span>
    <span class="hint">時刻セルをクリック → 現在時刻の候補／そのまま数字を打てば手入力</span>
    <button id="btnCsv">CSV出力</button>
    <button id="btnBackup">バックアップ保存</button>
    <button id="btnRestore">読込</button>
    <button id="btnPrint">印刷</button>
    <button id="btnClear" class="danger">全消去</button>
    <input type="file" id="fileIn" accept=".json,application/json" hidden>
  </div>

  <div class="grid-wrap" id="gridWrap" tabindex="0">
    <table class="grid" id="grid"></table>
  </div>

  <div class="summary">
    <h2>集計</h2>
    <div class="stats" id="stats"></div>
  </div>
  <div class="saveinfo" id="saveinfo"></div>
</div>

<div id="picker"></div>

<script>
"use strict";

/* ============================================================
   列定義
   ============================================================ */
const COLS = [
  {key:'no',      label:'納入番号',  type:'text', w:62,  align:'center'},
  {key:'truck',   label:'車両番号',  type:'text', w:134},
  {key:'vol',     label:'積載量',    sub:'m³',    type:'num',  w:66},
  {key:'cum',     label:'累計数量',  sub:'m³',    type:'num',  w:78, auto:true},
  {key:'depart',  label:'発時間',    type:'time', w:76},
  {key:'arrive',  label:'着時間',    type:'time', w:76},
  {key:'ustart',  label:'荷卸開始',  type:'time', w:76},
  {key:'uend',    label:'荷卸終了',  type:'time', w:76},
  {key:'back',    label:'帰着時間',  type:'time', w:76},
  {key:'d_tr',    label:'輸送時間',  sub:'発→着',        type:'calc', w:74},
  {key:'d_wait',  label:'待機時間',  sub:'着→荷卸開始',  type:'calc', w:84},
  {key:'d_unld',  label:'荷卸時間',  sub:'開始→終了',    type:'calc', w:80},
  {key:'d_back',  label:'帰着まで',  sub:'荷卸終了→帰着',type:'calc', w:88},
  {key:'d_done',  label:'発→荷卸完了',sub:'所要時間',    type:'calc', w:90},
  {key:'d_cycle', label:'サイクル',  sub:'発→帰着',      type:'calc', w:78},
  {key:'memo',    label:'備考',      type:'text', w:150},
];
const TIME_KEYS = COLS.filter(c=>c.type==='time').map(c=>c.key);
const CALC_KEYS = COLS.filter(c=>c.type==='calc').map(c=>c.key);
const KEY_INDEX = {}; COLS.forEach((c,i)=>KEY_INDEX[c.key]=i);

const STORE = 'namacon-dansetsu-v1';
const HEAD_IDS = ['h_site','h_builder','h_date','h_part','h_plant','h_mix','h_plan','h_weather'];

/* ============================================================
   状態
   ============================================================ */
let rows = [];
let sel  = {r:0, c:0};
let editing = null;     // {r,c,input}
let picker  = {open:false, r:0, c:0, idx:0, items:[]};

const $ = id => document.getElementById(id);
const gridEl = $('grid');
const pickerEl = $('picker');

function newRow(no){
  const o = {};
  COLS.forEach(c=>{ if(c.type!=='calc') o[c.key]=''; });
  o.no = no==null ? '' : String(no);
  return o;
}

/* ============================================================
   時刻ユーティリティ
   ============================================================ */
const pad2 = n => String(n).padStart(2,'0');

/** 文字列 → 0時からの分。解釈できなければ null */
function parseTime(s){
  if(s==null) return null;
  let t = String(s).trim();
  if(!t) return null;
  // 全角→半角、区切りの正規化
  t = t.replace(/[０-９]/g, ch=>String.fromCharCode(ch.charCodeAt(0)-0xFEE0))
       .replace(/[：。．\.\-ー時]/g,':')
       .replace(/分$/,'')
       .replace(/\s+/g,'');
  let m;
  if((m = t.match(/^(\d{1,2}):(\d{1,2})(?::\d{1,2})?$/))){
    const h=+m[1], mi=+m[2];
    if(h<=47 && mi<=59) return (h%24)*60+mi;
    return null;
  }
  if((m = t.match(/^(\d{3,4})$/))){          // 1234 → 12:34 / 934 → 9:34
    const v=m[1], h=+v.slice(0,v.length-2), mi=+v.slice(-2);
    if(h<=47 && mi<=59) return (h%24)*60+mi;
    return null;
  }
  if((m = t.match(/^(\d{1,2})$/))){          // 9 → 9:00
    const h=+m[1];
    if(h<=47) return (h%24)*60;
    return null;
  }
  return null;
}
const fmtTime = min => min==null ? '' : pad2(Math.floor(min/60)%24)+':'+pad2(min%60);

/** 経過分。日跨ぎは +24h として扱う */
function span(a,b){
  if(a==null||b==null) return null;
  let d = b-a;
  if(d<0) d += 1440;
  return d;
}
function fmtDur(d){
  if(d==null) return '';
  return Math.floor(d/60)+':'+pad2(d%60);
}
function nowMin(){
  const d = new Date();
  return d.getHours()*60 + d.getMinutes();
}

/* ============================================================
   計算
   ============================================================ */
/** 行の計算値 */
function calcRow(r){
  const o = rows[r];
  const t = k => parseTime(o[k]);
  const dep=t('depart'), arr=t('arrive'), us=t('ustart'), ue=t('uend'), bk=t('back');
  return {
    d_tr   : span(dep, arr),
    d_wait : span(arr, us),
    d_unld : span(us,  ue),
    d_back : span(ue,  bk),
    d_done : span(dep, ue),
    d_cycle: span(dep, bk),
  };
}
/** 累計数量（手入力があればそれを基点に継続） */
function cumulative(){
  const out = []; let run = 0;
  rows.forEach(o=>{
    const manual = o.cum!=='' && o.cum!=null ? parseFloat(o.cum) : NaN;
    if(!isNaN(manual)){ run = manual; out.push({v:run, manual:true}); return; }
    const v = parseFloat(o.vol);
    if(!isNaN(v)) run += v;
    out.push({v: run, manual:false});
  });
  return out;
}
const round2 = n => Math.round(n*100)/100;

/* ============================================================
   描画
   ============================================================ */
function render(){
  const cum = cumulative();

  let h = '<colgroup><col style="width:34px">' +
          COLS.map(c=>`<col style="width:${c.w}px">`).join('') + '</colgroup>';

  h += '<thead><tr><th class="rowhead">No</th>' + COLS.map(c=>{
    const cls = c.type==='time' ? 'g-time' : (c.type==='calc' ? 'g-calc' : '');
    return `<th class="${cls}">${c.label}${c.sub?`<span class="sub">${c.sub}</span>`:'<span class="sub">&nbsp;</span>'}</th>`;
  }).join('') + '</tr></thead>';

  h += '<tbody>';
  rows.forEach((o,r)=>{
    const cv = calcRow(r);
    h += `<tr data-r="${r}"><th class="rowhead" data-rowhead="${r}">${r+1}</th>`;
    COLS.forEach((c,ci)=>{
      const isSel = (sel.r===r && sel.c===ci);
      let txt='', extra='';
      if(c.type==='calc'){
        const d = cv[c.key];
        txt = fmtDur(d);
        if(d!=null && d>720) extra += ' bad';               // 12時間超＝入力ミスの可能性
        if(c.key==='d_wait' && d!=null){
          if(d>=60) extra += ' alert'; else if(d>=30) extra += ' warn';
        }
      }else if(c.key==='cum'){
        const e = cum[r];
        txt = ((o.vol||'')!=='' || e.manual) ? String(round2(e.v)) : '';   // 未入力行は空欄
        if(!e.manual) extra += ' auto';
      }else{
        txt = o[c.key] ?? '';
        if(c.type==='time'){
          const p = parseTime(txt);
          if(p!=null) txt = fmtTime(p); else if(txt!=='') extra += ' bad';
        }
      }
      h += `<td class="cell t-${c.type}${extra}${isSel?' sel':''}" data-r="${r}" data-c="${ci}">`+
           `<span class="v">${escapeHtml(txt)}</span></td>`;
    });
    h += '</tr>';
  });
  h += '</tbody>';

  gridEl.innerHTML = h;
  renderStats(cum);
  save();
}
function escapeHtml(s){
  return String(s).replace(/[&<>"]/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
}

function renderStats(cum){
  // 納入番号だけの空行は台数に数えない
  const COUNT_KEYS = ['truck','vol','depart','arrive','ustart','uend','back'];
  const filled = rows.filter(o=>COUNT_KEYS.some(k=>(o[k]||'')!==''));
  const avg = key=>{
    const a = rows.map((_,r)=>calcRow(r)[key]).filter(v=>v!=null && v<=720);
    return a.length ? Math.round(a.reduce((x,y)=>x+y,0)/a.length) : null;
  };
  const max = key=>{
    const a = rows.map((_,r)=>calcRow(r)[key]).filter(v=>v!=null && v<=720);
    return a.length ? Math.max(...a) : null;
  };
  // 打設済み数量＝荷卸終了が入っている行の積載量合計
  let done = 0;
  rows.forEach(o=>{ if(parseTime(o.uend)!=null){ const v=parseFloat(o.vol); if(!isNaN(v)) done+=v; } });
  const total = cum.length ? cum[cum.length-1].v : 0;

  // 打設ペース：最初の荷卸開始 → 最後の荷卸終了
  const starts = rows.map(o=>parseTime(o.ustart)).filter(v=>v!=null);
  const ends   = rows.map(o=>parseTime(o.uend)).filter(v=>v!=null);
  let pace=null, elapsed=null;
  if(starts.length && ends.length){
    elapsed = span(Math.min(...starts), Math.max(...ends));
    if(elapsed && elapsed>0 && done>0) pace = done/(elapsed/60);
  }
  const plan = parseFloat($('h_plan').value);
  const prog = (!isNaN(plan) && plan>0) ? Math.round(done/plan*1000)/10 : null;

  const cards = [
    ['台数',        filled.length, '台'],
    ['総数量',      round2(total), 'm³'],
    ['打設済数量',  round2(done),  'm³'],
    ['進捗率',      prog==null?'―':prog, prog==null?'':'%'],
    ['平均輸送時間', fmtDur(avg('d_tr')) || '―', ''],
    ['平均待機時間', fmtDur(avg('d_wait')) || '―', ''],
    ['最大待機時間', fmtDur(max('d_wait')) || '―', ''],
    ['平均荷卸時間', fmtDur(avg('d_unld')) || '―', ''],
    ['平均サイクル', fmtDur(avg('d_cycle')) || '―', ''],
    ['打設所要時間', fmtDur(elapsed) || '―', ''],
    ['打設ペース',  pace==null?'―':Math.round(pace*10)/10, pace==null?'':'m³/h'],
  ];
  $('stats').innerHTML = cards.map(([k,n,u])=>
    `<div class="stat"><span class="k">${k}</span><span class="n">${n}${u?`<small>${u}</small>`:''}</span></div>`
  ).join('');
}

/* ============================================================
   セル選択・移動
   ============================================================ */
function cellEl(r,c){ return gridEl.querySelector(`td.cell[data-r="${r}"][data-c="${c}"]`); }

function select(r,c,{scroll=true}={}){
  r = Math.max(0, Math.min(rows.length-1, r));
  c = Math.max(0, Math.min(COLS.length-1, c));
  gridEl.querySelectorAll('td.sel').forEach(td=>td.classList.remove('sel'));
  sel = {r,c};
  const td = cellEl(r,c);
  if(td){
    td.classList.add('sel');
    if(scroll) td.scrollIntoView({block:'nearest', inline:'nearest'});
  }
}
function move(dr,dc){
  closePicker(); commitEdit();
  let r=sel.r+dr, c=sel.c+dc;
  if(c<0){ c=COLS.length-1; r--; }
  if(c>COLS.length-1){ c=0; r++; }
  if(r<0) r=0;
  if(r>rows.length-1){ if(dr>0||dc>0){ addRow(); } r=Math.min(r, rows.length-1); }
  select(r,c);
}

/* ============================================================
   セル編集（文字入力モード）
   ============================================================ */
function beginEdit(r,c,initial){
  const col = COLS[c];
  if(col.type==='calc') return;
  closePicker();
  commitEdit();
  const td = cellEl(r,c);
  if(!td) return;
  const cur = rows[r][col.key] ?? '';
  const inp = document.createElement('input');
  inp.className='editor';
  inp.type='text';
  if(col.type==='num') inp.inputMode='decimal';
  else if(col.type==='time') inp.inputMode='numeric';
  inp.value = (initial!=null && initial!=='') ? initial : cur;
  td.innerHTML=''; td.appendChild(inp);
  inp.focus();
  if(initial!=null && initial!=='') inp.setSelectionRange(inp.value.length, inp.value.length);
  else inp.select();
  editing = {r,c,input:inp};

  inp.addEventListener('keydown', e=>{
    if(e.key==='Enter'){ e.preventDefault(); commitEdit(); move(1,0); }
    else if(e.key==='Escape'){ e.preventDefault(); cancelEdit(); }
    else if(e.key==='Tab'){ e.preventDefault(); commitEdit(); move(0, e.shiftKey?-1:1); }
    e.stopPropagation();
  });
  inp.addEventListener('blur', ()=>{ if(editing && editing.input===inp) commitEdit(); });
}
function commitEdit(){
  if(!editing) return;
  const {r,c,input} = editing;
  const col = COLS[c];
  let v = input.value.trim();
  if(col.type==='time'){
    const p = parseTime(v);
    if(p!=null) v = fmtTime(p);          // 9 / 934 / 9:34 → 09:34 に整形
  }
  editing = null;
  rows[r][col.key] = v;
  render();
  select(r,c,{scroll:false});
}
function cancelEdit(){
  if(!editing) return;
  const {r,c} = editing;
  editing = null;
  render();
  select(r,c,{scroll:false});
}

/* ============================================================
   時刻ピッカー（クリックで現在時刻の候補）
   ============================================================ */
const OFFSETS = [0,-1,-2,-3,-5,-10];

function openPicker(r,c){
  commitEdit();
  const td = cellEl(r,c);
  if(!td) return;
  const base = nowMin();
  picker.items = OFFSETS.map(off=>({min:(base+off+1440)%1440, off}));
  picker.open=true; picker.r=r; picker.c=c; picker.idx=0;
  drawPicker();
  pickerEl.style.display='block';
  positionPicker();
}
/** 対象セルに追従して表示位置を決める（スクロールしても閉じない） */
function positionPicker(){
  if(!picker.open) return;
  const td = cellEl(picker.r, picker.c);
  const wrap = $('gridWrap');
  if(!td){ closePicker(); return; }
  const rect = td.getBoundingClientRect();
  const wr = wrap.getBoundingClientRect();
  // セルが表の表示範囲外へ出たら閉じる
  if(rect.right < wr.left || rect.left > wr.right || rect.bottom < wr.top || rect.top > wr.bottom){
    closePicker(); return;
  }
  const vw = document.documentElement.clientWidth;
  const vh = document.documentElement.clientHeight;
  const pw = pickerEl.offsetWidth, ph = pickerEl.offsetHeight;
  let left = rect.left;
  let top  = rect.bottom + 2;
  if(left + pw > vw - 6) left = vw - pw - 6;
  if(top + ph > vh - 4)  top = (rect.top > ph + 4) ? rect.top - ph - 2 : Math.max(4, vh - ph - 4);
  pickerEl.style.left = Math.max(4, left) + window.scrollX + 'px';
  pickerEl.style.top  = Math.max(4, top)  + window.scrollY + 'px';
}
function drawPicker(){
  const cur = rows[picker.r][COLS[picker.c].key] || '';
  let h = `<div class="pk-head">${COLS[picker.c].label}${cur?`（現在の入力：${escapeHtml(cur)}）`:''}</div>`;
  picker.items.forEach((it,i)=>{
    if(it.off===0){
      h += `<button data-i="${i}" class="now${i===picker.idx?' on':''}">現在時刻　${fmtTime(it.min)}</button>`;
      h += '<div class="pk-sep"></div>';
    }else{
      h += `<button data-i="${i}" class="${i===picker.idx?'on':''}">`+
           `<span class="t">${fmtTime(it.min)}</span><span class="lbl">${-it.off}分前</span></button>`;
    }
  });
  h += '<div class="pk-sep"></div>'+
       '<button data-act="manual">✎ 手入力する…</button>'+
       '<button data-act="clear">✕ 消去</button>'+
       '<div class="pk-foot">数字を打つとそのまま手入力モード<br>Enter…選択　Esc…閉じる</div>';
  pickerEl.innerHTML = h;
}
function closePicker(){
  if(!picker.open) return;
  picker.open=false;
  pickerEl.style.display='none';
}
function applyPicker(i){
  const it = picker.items[i];
  const {r,c} = picker;
  rows[r][COLS[c].key] = fmtTime(it.min);
  closePicker();
  render();
  select(r,c,{scroll:false});
}

pickerEl.addEventListener('mousedown', e=>{
  const b = e.target.closest('button');
  if(!b) return;
  e.preventDefault();
  const {r,c} = picker;
  if(b.dataset.act==='manual'){ closePicker(); beginEdit(r,c); return; }
  if(b.dataset.act==='clear'){
    rows[r][COLS[c].key]=''; closePicker(); render(); select(r,c,{scroll:false}); return;
  }
  applyPicker(+b.dataset.i);
});

/* ============================================================
   入力イベント
   ============================================================ */
/** ヘッダー欄などにフォーカスが残らないよう、表側へフォーカスを移す */
function focusGrid(){
  const a = document.activeElement;
  if(a && a.classList && a.classList.contains('editor')) return;
  $('gridWrap').focus({preventScroll:true});
}
gridEl.addEventListener('mousedown', e=>{
  const rh = e.target.closest('th[data-rowhead]');
  if(rh){ commitEdit(); closePicker(); focusGrid(); select(+rh.dataset.rowhead, 0); return; }
  const td = e.target.closest('td.cell');
  if(!td) return;
  const r=+td.dataset.r, c=+td.dataset.c;
  if(editing && editing.r===r && editing.c===c) return;
  e.preventDefault();
  focusGrid();
  commitEdit();
  const col = COLS[c];
  if(picker.open && picker.r===r && picker.c===c){ closePicker(); select(r,c); return; }
  closePicker();
  select(r,c);
  if(col.type==='time') openPicker(r,c);       // 枠を押すと現在時刻の候補を表示
});
gridEl.addEventListener('dblclick', e=>{
  const td = e.target.closest('td.cell');
  if(!td) return;
  beginEdit(+td.dataset.r, +td.dataset.c);      // ダブルクリックで直接手入力
});

document.addEventListener('mousedown', e=>{
  if(picker.open && !pickerEl.contains(e.target) && !e.target.closest('td.cell')) closePicker();
});

document.addEventListener('keydown', e=>{
  if(editing) return;
  const tag = (e.target.tagName||'').toLowerCase();
  if(tag==='input' && !e.target.classList.contains('editor')) return;   // ヘッダー入力中

  /* --- ピッカー表示中 --- */
  if(picker.open){
    if(e.key==='ArrowDown'){ e.preventDefault(); picker.idx=(picker.idx+1)%picker.items.length; drawPicker(); return; }
    if(e.key==='ArrowUp'){ e.preventDefault(); picker.idx=(picker.idx-1+picker.items.length)%picker.items.length; drawPicker(); return; }
    if(e.key==='Enter'){ e.preventDefault(); applyPicker(picker.idx); return; }
    if(e.key==='Escape'){ e.preventDefault(); closePicker(); return; }
    if(e.key==='Tab'){ e.preventDefault(); closePicker(); move(0, e.shiftKey?-1:1); return; }
    if(e.key==='Delete'||e.key==='Backspace'){
      e.preventDefault();
      rows[picker.r][COLS[picker.c].key]='';
      const {r,c}=picker; closePicker(); render(); select(r,c,{scroll:false}); return;
    }
    // 入力しようとした ＝ 現在時刻ではないと判断 → 文字入力モードへ
    if(e.key.length===1 && !e.ctrlKey && !e.metaKey && !e.altKey){
      e.preventDefault();
      const {r,c} = picker;
      closePicker();
      beginEdit(r,c,e.key);
      return;
    }
    return;
  }

  /* --- 通常のセル選択中 --- */
  switch(e.key){
    case 'ArrowUp':    e.preventDefault(); move(-1,0); return;
    case 'ArrowDown':  e.preventDefault(); move(1,0);  return;
    case 'ArrowLeft':  e.preventDefault(); move(0,-1); return;
    case 'ArrowRight': e.preventDefault(); move(0,1);  return;
    case 'Tab':        e.preventDefault(); move(0, e.shiftKey?-1:1); return;
    case 'Enter':
      e.preventDefault();
      if(COLS[sel.c].type==='time') openPicker(sel.r, sel.c);
      else beginEdit(sel.r, sel.c);
      return;
    case 'F2': e.preventDefault(); beginEdit(sel.r, sel.c); return;
    case 'Delete': case 'Backspace':
      e.preventDefault();
      if(COLS[sel.c].type!=='calc'){ rows[sel.r][COLS[sel.c].key]=''; render(); select(sel.r,sel.c,{scroll:false}); }
      return;
    case 'Escape': closePicker(); return;
  }
  if(e.key.length===1 && !e.ctrlKey && !e.metaKey && !e.altKey){
    e.preventDefault();
    beginEdit(sel.r, sel.c, e.key);
  }
});

/* ============================================================
   行操作
   ============================================================ */
function nextNo(){
  let mx = 0;
  rows.forEach(o=>{ const n=parseInt(o.no,10); if(!isNaN(n)&&n>mx) mx=n; });
  return mx+1;
}
function addRow(n=1){
  for(let i=0;i<n;i++) rows.push(newRow(nextNo()));
  render();
}
$('btnAdd').onclick   = ()=>{ addRow(1); select(rows.length-1, KEY_INDEX.truck); };
$('btnAdd5').onclick  = ()=>{ addRow(5); };
$('btnInsert').onclick= ()=>{
  commitEdit(); closePicker();
  rows.splice(sel.r+1, 0, newRow(''));
  render(); select(sel.r+1, 0);
};
$('btnDel').onclick = ()=>{
  commitEdit(); closePicker();
  if(rows.length<=1){ rows=[newRow(1)]; render(); select(0,0); return; }
  if(!confirm(`${sel.r+1}行目を削除します。よろしいですか？`)) return;
  rows.splice(sel.r,1);
  render(); select(Math.min(sel.r, rows.length-1), sel.c);
};
$('btnClear').onclick = ()=>{
  if(!confirm('入力内容をすべて消去します。よろしいですか？')) return;
  HEAD_IDS.forEach(id=>{ $(id).value=''; });
  rows = Array.from({length:10},(_,i)=>newRow(i+1));
  render(); select(0,0);
};
$('btnPrint').onclick = ()=>{ commitEdit(); closePicker(); window.print(); };

/* ============================================================
   CSV 出力
   ============================================================ */
$('btnCsv').onclick = ()=>{
  commitEdit(); closePicker();
  const cum = cumulative();
  const q = s => `"${String(s??'').replace(/"/g,'""')}"`;
  const L = [];
  L.push([q('現場名'),q($('h_site').value),q('施工者名'),q($('h_builder').value)].join(','));
  L.push([q('打設日'),q($('h_date').value),q('打設箇所'),q($('h_part').value)].join(','));
  L.push([q('生コン工場'),q($('h_plant').value),q('配合'),q($('h_mix').value),
          q('予定数量'),q($('h_plan').value),q('天候'),q($('h_weather').value)].join(','));
  L.push('');
  L.push(COLS.map(c=>q(c.label+(c.sub?`(${c.sub})`:''))).join(','));
  rows.forEach((o,r)=>{
    const cv = calcRow(r);
    L.push(COLS.map(c=>{
      if(c.type==='calc') return q(fmtDur(cv[c.key]));
      if(c.key==='cum')   return q(((o.vol||'')!=='' || cum[r].manual) ? round2(cum[r].v) : '');
      return q(o[c.key]);
    }).join(','));
  });
  const blob = new Blob(['﻿'+L.join('\r\n')], {type:'text/csv;charset=utf-8;'});
  downloadBlob(blob, fileStem()+'.csv');
};

/* ============================================================
   バックアップ（JSONファイル）
   ============================================================ */
function fileStem(){
  const d = $('h_date').value || new Date().toISOString().slice(0,10);
  const site = ($('h_site').value||'現場').replace(/[\\\/:*?"<>|]/g,'_');
  return `打設管理_${site}_${d}`;
}
function downloadBlob(blob, name){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name; a.style.display='none';
  document.body.appendChild(a);
  a.click();
  setTimeout(()=>{ document.body.removeChild(a); URL.revokeObjectURL(url); }, 1000);
}
$('btnBackup').onclick = ()=>{
  commitEdit(); closePicker();
  const head={}; HEAD_IDS.forEach(id=>head[id]=$(id).value);
  const blob = new Blob([JSON.stringify({app:'namacon-dansetsu', ver:1, head, rows}, null, 1)],
                        {type:'application/json'});
  downloadBlob(blob, fileStem()+'.json');
};
$('btnRestore').onclick = ()=>{ $('fileIn').value=''; $('fileIn').click(); };
$('fileIn').addEventListener('change', e=>{
  const f = e.target.files && e.target.files[0];
  if(!f) return;
  const rd = new FileReader();
  rd.onload = ()=>{
    let d=null;
    try{ d = JSON.parse(rd.result); }catch(_){}
    if(!d || !Array.isArray(d.rows)){ alert('読み込めるデータがありません。'); return; }
    if(!confirm('現在の入力内容を、読み込んだ内容で置き換えます。よろしいですか？')) return;
    rows = d.rows.map(o=>Object.assign(newRow(''), o));
    if(!rows.length) rows=[newRow(1)];
    if(d.head) HEAD_IDS.forEach(id=>{ $(id).value = d.head[id] ?? ''; });
    render(); select(0,0);
  };
  rd.readAsText(f);
});

/* ============================================================
   保存・復元
   ============================================================ */
let saveTimer=null, lastSave=0;
function doSave(){
  clearTimeout(saveTimer); saveTimer=null;
  lastSave = Date.now();
  const head={}; HEAD_IDS.forEach(id=>head[id]=$(id).value);
  try{
    localStorage.setItem(STORE, JSON.stringify({head, rows}));
    const t=new Date();
    $('saveinfo').textContent = `自動保存済み（${pad2(t.getHours())}:${pad2(t.getMinutes())}:${pad2(t.getSeconds())}）／データはこの端末のブラウザに保存されます`;
  }catch(_){
    $('saveinfo').textContent = '※ 自動保存に失敗しました。バックアップ保存をご利用ください';
  }
}
/** 連続入力中でも保存が先送りされ続けないよう、一定間隔で必ず書き込む */
function save(){
  if(Date.now()-lastSave > 1000){ doSave(); return; }
  if(saveTimer) return;
  saveTimer = setTimeout(doSave, 400);
}
window.addEventListener('beforeunload', doSave);
window.addEventListener('pagehide', doSave);
document.addEventListener('visibilitychange', ()=>{ if(document.hidden) doSave(); });
function load(){
  let d=null;
  try{ d = JSON.parse(localStorage.getItem(STORE)||'null'); }catch(_){}
  if(d && Array.isArray(d.rows) && d.rows.length){
    rows = d.rows.map(o=>Object.assign(newRow(''), o));
    if(d.head) HEAD_IDS.forEach(id=>{ if(d.head[id]!=null) $(id).value=d.head[id]; });
  }else{
    rows = Array.from({length:10},(_,i)=>newRow(i+1));
    $('h_date').value = new Date().toISOString().slice(0,10);
  }
}
HEAD_IDS.forEach(id=>$(id).addEventListener('input', ()=>{ save(); renderStats(cumulative()); }));

/* ============================================================
   起動
   ============================================================ */
load();
render();
select(0,0,{scroll:false});
window.addEventListener('resize', positionPicker);
window.addEventListener('scroll', positionPicker, {passive:true});
$('gridWrap').addEventListener('scroll', positionPicker, {passive:true});
</script>
